<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile | Amirali Gholian</title>
  <link rel="icon" href="./logo.png" type="image/png">
  
  <!-- PWA & Manifest -->
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/logo.png">
  <meta name="theme-color" content="#050814">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Amirali Gholian">

  
  <!-- SEO & Security -->
  <meta name="description" content="پروفایل کاربری امیرعلی قولیان">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <style>
    :root {
      --bg0: #050814;
      --bg1: #070b16;
      --panel: rgba(15, 23, 42, .72);
      --line: rgba(148, 163, 184, .16);
      --text: #e5e7eb;
      --muted: #94a3b8;
      --soft: #cbd5e1;
      --accent: #38bdf8;
      --accent-2: #22c55e;
      --accent-3: #a78bfa;
      --shadow: 0 20px 60px rgba(0, 0, 0, .42);
      --radius: 26px;
      --max: 1180px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: 
        radial-gradient(circle at top left, rgba(56,189,248,.14), transparent 28%),
        radial-gradient(circle at top right, rgba(167,139,250,.12), transparent 24%),
        linear-gradient(180deg, var(--bg0), var(--bg1) 55%, #04060b 100%);
      color: var(--text);
      overflow-x: hidden;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Topbar */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 40;
      background: rgba(4, 8, 15, .62);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255, 255, 255, .08);
      box-shadow: 0 4px 16px rgba(0, 0, 0, .2);
    }

    .topbar-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 24px;
      padding: 14px 0;
      width: min(var(--max), calc(100% - 32px));
      margin: 0 auto;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: .3s;
      text-decoration: none;
    }

    .brand:hover {
      opacity: .85;
    }

    .avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent-2), var(--accent-3));
      display: grid;
      place-items: center;
      border: 2px solid rgba(255, 255, 255, .2);
      box-shadow: 0 8px 24px rgba(56, 189, 248, .15);
      overflow: hidden;
      flex: 0 0 auto;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .avatar span {
      font-weight: 800;
      color: #fff;
      letter-spacing: .5px;
      font-size: 1.2rem;
    }

    .brand h1 {
      margin: 0;
      font-size: 1rem;
      line-height: 1.1;
      font-weight: 700;
      background: linear-gradient(135deg, #fff, var(--soft));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .brand small {
      display: block;
      margin-top: 4px;
      color: var(--accent);
      font-size: .75rem;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    nav {
      display: flex;
      gap: 8px;
      align-items: center;
      position: relative;
    }

    .back-btn {
      padding: 10px 14px;
      border-radius: 999px;
      border: 1px solid transparent;
      background: rgba(255, 255, 255, .08);
      color: #dbe4ef;
      cursor: pointer;
      transition: all .25s ease;
      font-size: .95rem;
      font-family: inherit;
      font-weight: 500;
      display: none;
    }

    .back-btn.show {
      display: block;
    }

    .back-btn:hover {
      background: rgba(255, 255, 255, .12);
      border-color: rgba(255, 255, 255, .12);
      transform: translateY(-1px);
      color: #fff;
    }

    nav a, nav button {
      padding: 10px 14px;
      border-radius: 999px;
      border: 1px solid transparent;
      background: none;
      color: #dbe4ef;
      cursor: pointer;
      transition: all .25s ease;
      font-size: .95rem;
      font-family: inherit;
      font-weight: 500;
    }

    nav a:hover, nav button:hover {
      background: rgba(255, 255, 255, .08);
      border-color: rgba(255, 255, 255, .12);
      transform: translateY(-1px);
      color: #fff;
    }

    /* RTL Support for Persian */
    body[data-lang="fa"] {
      direction: rtl;
    }

    body[data-lang="fa"] .topbar-inner {
      flex-direction: row-reverse;
    }

    body[data-lang="fa"] .brand {
      flex-direction: row-reverse;
    }

    body[data-lang="fa"] nav {
      flex-direction: row-reverse;
    }

    body[data-lang="fa"] .dropdown-menu {
      right: auto;
      left: 24px;
    }

    body[data-lang="fa"] .dropdown-item {
      text-align: right;
    }

    /* Language Switch Button */
    .lang-btn {
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, .15);
      background: rgba(56, 189, 248, .1);
      color: var(--accent);
      cursor: pointer;
      transition: all .25s ease;
      font-size: .85rem;
      font-family: inherit;
      font-weight: 600;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .lang-btn:hover {
      background: rgba(56, 189, 248, .2);
      border-color: var(--accent);
      transform: translateY(-1px);
      color: #fff;
    }

    .lang-btn.active {
      background: linear-gradient(135deg, var(--accent), rgba(56, 189, 248, .3));
      border-color: var(--accent);
      color: #fff;
    }

    /* Menu Button - Redesigned */
    .menu-btn {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: linear-gradient(135deg, rgba(56, 189, 248, .05), rgba(167, 139, 250, .05));
      border: 1.5px solid rgba(56, 189, 248, .25);
      cursor: pointer;
      transition: all .25s cubic-bezier(0.16, 1, 0.3, 1);
      color: var(--accent);
      font-size: 1.1rem;
      position: relative;
    }

    .menu-btn:hover {
      background: linear-gradient(135deg, rgba(56, 189, 248, .15), rgba(167, 139, 250, .15));
      border-color: var(--accent);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(56, 189, 248, .15);
    }

    .menu-btn:active {
      transform: translateY(0);
    }

    /* Dropdown Menu */
    .dropdown-menu {
      position: absolute;
      top: calc(100% + 12px);
      right: 24px;
      width: 320px;
      background: linear-gradient(135deg, rgba(15, 23, 42, .99), rgba(12, 17, 35, .97));
      border: 1px solid rgba(56, 189, 248, .2);
      border-radius: 16px;
      box-shadow: 0 24px 64px rgba(0, 0, 0, .5), 0 0 1px rgba(56, 189, 248, .2) inset;
      backdrop-filter: blur(20px);
      opacity: 0;
      visibility: hidden;
      transform: translateY(-8px) scale(.95);
      transition: all .25s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 1000;
      padding: 12px;
      max-height: 70vh;
      overflow-y: auto;
    }

    .dropdown-menu.show {
      opacity: 1;
      visibility: visible;
      transform: translateY(0) scale(1);
    }

    .dropdown-item {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding: 12px 16px;
      background: transparent;
      border: none;
      border-radius: 10px;
      color: #dbe4ef;
      cursor: pointer;
      font-size: .95rem;
      font-family: inherit;
      font-weight: 500;
      text-align: left;
      transition: all .2s ease;
    }

    .dropdown-item:hover {
      background: rgba(56, 189, 248, .15);
      color: #fff;
      transform: translateX(-4px);
    }

    .dropdown-item.danger:hover {
      background: rgba(239, 68, 68, .15);
      color: #fca5a5;
    }

    .dropdown-divider {
      height: 1px;
      background: rgba(255, 255, 255, .08);
      margin: 8px 0;
    }

    /* Admin Badge */
    .admin-badge {
      display: inline-block;
      padding: 4px 10px;
      background: linear-gradient(135deg, #22c55e, #16a34a);
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      color: #fff;
      margin-left: 8px;
    }

    body[data-lang="fa"] .admin-badge {
      margin-left: 0;
      margin-right: 8px;
    }

    /* Main Container */
    .container {
      flex: 1;
      width: min(var(--max), calc(100% - 32px));
      margin: 0 auto;
      padding: 32px 0;
    }

    /* Sections */
    .section {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 32px 28px;
      margin-bottom: 24px;
      backdrop-filter: blur(10px);
    }

    .section-title {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .section-title small {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--muted);
    }

    /* Profile Header */
    .profile-header {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 32px;
      align-items: center;
      margin-bottom: 32px;
    }

    .profile-left {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .profile-avatar {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent-2), var(--accent-3));
      display: grid;
      place-items: center;
      border: 3px solid rgba(255, 255, 255, .15);
      box-shadow: 0 20px 60px rgba(56, 189, 248, .2);
      font-size: 5rem;
      overflow: hidden;
    }

    .profile-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .profile-info h2 {
      margin: 0 0 8px 0;
      font-size: 1.8rem;
      color: #fff;
    }

    .profile-info p {
      margin: 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .tabs {
      display: flex;
      gap: 8px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 24px;
      overflow-x: auto;
    }

    .tab-btn {
      padding: 12px 16px;
      border: none;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 500;
      border-bottom: 2px solid transparent;
      transition: all .25s;
      white-space: nowrap;
    }

    .tab-btn.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }

    .tab-btn:hover:not(.active) {
      color: var(--text);
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    /* File Upload */
    .upload-zone {
      border: 2px dashed rgba(56, 189, 248, .3);
      border-radius: 16px;
      padding: 32px;
      text-align: center;
      cursor: pointer;
      transition: all .25s;
      background: rgba(56, 189, 248, .05);
    }

    .upload-zone:hover {
      border-color: var(--accent);
      background: rgba(56, 189, 248, .1);
    }

    .upload-zone.dragover {
      border-color: var(--accent);
      background: rgba(56, 189, 248, .15);
    }

    .upload-zone-icon {
      font-size: 3rem;
      margin-bottom: 12px;
    }

    .upload-zone-text {
      color: var(--text);
      font-size: 1rem;
      font-weight: 500;
      margin-bottom: 4px;
    }

    .upload-zone-hint {
      color: var(--muted);
      font-size: 0.85rem;
    }

    #fileInput {
      display: none;
    }

    .file-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px;
      background: rgba(255, 255, 255, .03);
      border: 1px solid var(--line);
      border-radius: 12px;
      margin-bottom: 12px;
      transition: all .25s;
    }

    .file-item:hover {
      background: rgba(56, 189, 248, .08);
      border-color: rgba(56, 189, 248, .3);
    }

    .file-item-info {
      display: flex;
      align-items: center;
      gap: 16px;
      flex: 1;
    }

    .file-item-icon {
      font-size: 1.8rem;
    }

    .file-item-details p {
      margin: 0;
    }

    .file-item-name {
      color: #fff;
      font-weight: 500;
      margin-bottom: 4px;
    }

    .file-item-meta {
      color: var(--muted);
      font-size: 0.85rem;
    }

    .file-item-actions {
      display: flex;
      gap: 8px;
    }

    .file-btn {
      padding: 8px 12px;
      border: 1px solid rgba(56, 189, 248, .3);
      background: transparent;
      color: var(--accent);
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 500;
      transition: all .25s;
    }

    .file-btn:hover {
      background: rgba(56, 189, 248, .2);
      border-color: var(--accent);
    }

    .file-btn.delete {
      color: #fca5a5;
      border-color: rgba(239, 68, 68, .3);
    }

    .file-btn.delete:hover {
      background: rgba(239, 68, 68, .2);
      border-color: #fca5a5;
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
    }

    .empty-state-icon {
      font-size: 3rem;
      margin-bottom: 16px;
    }

    .empty-state h3 {
      margin: 0 0 8px 0;
      color: #fff;
    }

    .empty-state p {
      margin: 0;
      color: var(--muted);
    }

    /* Buttons */
    .btn {
      padding: 10px 16px;
      border: 1px solid transparent;
      border-radius: 8px;
      background: rgba(56, 189, 248, .1);
      color: var(--text);
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 500;
      transition: all .25s;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn:hover {
      background: rgba(56, 189, 248, .2);
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), #0ea5e9);
      color: #fff;
      border-color: var(--accent);
    }

    .btn-primary:hover {
      box-shadow: 0 8px 20px rgba(56, 189, 248, .3);
    }

    /* Messages */
    .alert {
      padding: 16px 20px;
      border-radius: 12px;
      margin-bottom: 16px;
      display: none;
      animation: slideIn .3s ease;
    }

    .alert.show {
      display: block;
    }

    .alert.success {
      background: rgba(34, 197, 94, .15);
      border: 1px solid rgba(34, 197, 94, .3);
      color: #86efac;
    }

    .alert.error {
      background: rgba(239, 68, 68, .15);
      border: 1px solid rgba(239, 68, 68, .3);
      color: #fca5a5;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Forms */
    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: var(--text);
      font-weight: 500;
      font-size: 0.95rem;
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, .05);
      color: var(--text);
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.95rem;
      transition: all .25s;
    }

    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
      outline: none;
      border-color: var(--accent);
      background: rgba(56, 189, 248, .05);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, .1);
    }

    .form-group textarea {
      resize: vertical;
      min-height: 100px;
    }

    /* Dropdown */
    .category-options {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }

    .category-option {
      padding: 10px 16px;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--text);
      border-radius: 8px;
      cursor: pointer;
      transition: all .25s;
      font-weight: 500;
    }

    .category-option:hover {
      border-color: var(--accent);
      background: rgba(56, 189, 248, .1);
    }

    .category-option.selected {
      background: linear-gradient(135deg, var(--accent), rgba(56, 189, 248, .3));
      border-color: var(--accent);
      color: #fff;
    }

    /* Grid */
    .grid-2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 16px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
    }

    /* Cards */
    .card {
      background: rgba(255, 255, 255, .03);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 20px;
      transition: all .25s;
    }

    .card:hover {
      background: rgba(56, 189, 248, .08);
      border-color: rgba(56, 189, 248, .3);
    }

    .card-title {
      color: #fff;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .card-text {
      color: var(--muted);
      font-size: 0.9rem;
      margin: 0;
    }

    .fileSelectedInfo {
      display: none;
      padding: 12px 16px;
      background: rgba(34, 197, 94, .15);
      border: 1px solid rgba(34, 197, 94, .3);
      border-radius: 8px;
      color: #86efac;
      margin-bottom: 16px;
      font-size: 0.9rem;
    }

    .fileSelectedInfo.show {
      display: block;
    }

    /* Message Container */
    .message-item {
      background: rgba(255, 255, 255, .03);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
    }

    .message-header {
      display: flex;
      justify-content: space-between;
      align-items: start;
      margin-bottom: 12px;
    }

    .message-author {
      font-weight: 600;
      color: #fff;
    }

    .message-time {
      color: var(--muted);
      font-size: 0.85rem;
    }

    .message-text {
      color: var(--text);
      line-height: 1.5;
      margin: 0;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .profile-header {
        grid-template-columns: 1fr;
        gap: 16px;
      }

      .profile-avatar {
        width: 120px;
        height: 120px;
        font-size: 3rem;
        margin: 0 auto;
      }

      .section {
        padding: 20px 16px;
      }

      .tabs {
        gap: 4px;
      }

      .tab-btn {
        padding: 10px 12px;
        font-size: 0.85rem;
      }

      .grid-2,
      .grid-3 {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body data-lang="en">
  <!-- Topbar -->
  <div class="topbar">
    <div class="topbar-inner">
      <a href="/" class="brand">
        <div class="avatar">
          <span>A</span>
        </div>
        <div>
          <h1>Amirali Gholian</h1>
          <small>Developer</small>
        </div>
      </a>
      <nav>
        <button class="back-btn" onclick="window.history.back()">← Back</button>
        <button class="lang-btn active" data-lang="en" title="English">EN</button>
        <button class="lang-btn" data-lang="fa" title="فارسی">FA</button>
        <button class="menu-btn" id="menuBtn">⋮</button>
      </nav>
      <div class="dropdown-menu" id="dropdownMenu">
        <button class="dropdown-item" onclick="alert('حساب کاربری شما')">👤 Profile</button>
        <button class="dropdown-item" id="adminPanelBtn" style="display:none;">
          🛡️ Admin Panel
        </button>
        <div class="dropdown-divider"></div>
        <button class="dropdown-item" onclick="toggleLanguage()">🌍 Language</button>
        <button class="dropdown-item danger" id="signOutDropdownBtn">🚪 Sign Out</button>
      </div>
    </div>
  </div>

  <!-- Main Content -->
  <div class="container">
    <!-- Profile Section -->
    <div class="section" id="profileSection">
      <div class="profile-header">
        <div class="profile-left">
          <div class="profile-avatar" id="profileAvatar">A</div>
        </div>
        <div class="profile-info">
          <h2 id="profileName">Loading...</h2>
          <p id="profileEmail">-</p>
          <p id="profileRole">-</p>
        </div>
      </div>
    </div>

    <!-- Alerts -->
    <div class="alert success" id="successMsg"></div>
    <div class="alert error" id="errorMsg"></div>

    <!-- Tabs -->
    <div class="section">
      <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('files')">📁 Files</button>
        <button class="tab-btn" onclick="switchTab('messages')">💬 Messages</button>
        <button class="tab-btn" onclick="switchTab('suggestions')">💡 Suggestions</button>
      </div>

      <!-- Files Tab -->
      <div id="files" class="tab-content active">
        <h3 class="section-title">📁 My Files</h3>
        
        <div class="upload-zone" id="uploadZone">
          <div class="upload-zone-icon">📤</div>
          <div class="upload-zone-text">Click or drag files here</div>
          <div class="upload-zone-hint">Max file size: 50 MB</div>
          <input type="file" id="fileInput" />
        </div>

        <div style="margin-top: 16px;" id="fileSelectedInfo" class="fileSelectedInfo">
          ✅ Selected: <span id="selectedFileName"></span>
        </div>

        <button class="btn btn-primary" id="uploadBtn" style="margin-top: 12px;">
          📤 Upload File
        </button>

        <div id="filesContainer" style="margin-top: 24px;"></div>
      </div>

      <!-- Messages Tab -->
      <div id="messages" class="tab-content">
        <h3 class="section-title">💬 Messages</h3>
        <div id="messagesContainer"></div>
      </div>

      <!-- Suggestions Tab -->
      <div id="suggestions" class="tab-content">
        <h3 class="section-title">💡 Send Suggestion</h3>
        <div class="form-group">
          <label>Title</label>
          <input type="text" id="suggestionTitle" placeholder="Enter suggestion title...">
        </div>
        <div class="form-group">
          <label>Category</label>
          <div class="category-options" id="categoryOptions">
            <button class="category-option selected" data-category="feature">✨ Feature</button>
            <button class="category-option" data-category="bug">🐛 Bug</button>
            <button class="category-option" data-category="improvement">🚀 Improvement</button>
          </div>
          <input type="hidden" id="suggestionCategory" value="feature">
        </div>
        <div class="form-group">
          <label>Description</label>
          <textarea id="suggestionText" placeholder="Describe your suggestion..."></textarea>
        </div>
        <button class="btn btn-primary" id="sendSuggestionBtn">Send Suggestion</button>
        <div id="suggestionsContainer" style="margin-top: 24px;"></div>
      </div>
    </div>
  </div>

  <!-- Supabase -->
  <script async src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Auth System -->
  <script>
    // =====================================================================
    // 🔧 تنظیم Supabase
    // =====================================================================
    const SUPABASE_URL = "https://cwwqmushilpxzpcpjute.supabase.co";
    const SUPABASE_KEY = "sb_publishable__AzVitbAoaYfEyvJMnIkkQ_AOkXCfbK";

    const { createClient } = window.supabase;
    const SUPABASE = createClient(SUPABASE_URL, SUPABASE_KEY);

    // =====================================================================
    // احراز هویت و مدیریت نقش‌های کاربری
    // =====================================================================
    class AdminAuth {
        static async checkAuth() {
            const { data: { user } } = await SUPABASE.auth.getUser();
            return user;
        }

        static async getUserProfile() {
            const user = await this.checkAuth();
            if (!user) return null;

            const { data, error } = await SUPABASE
                .from("profiles")
                .select("*")
                .eq("id", user.id)
                .single();

            if (error) {
                console.error("خطا در بدست آوردن پروفایل:", error);
                return null;
            }

            return data;
        }

        static async isAdmin() {
            const profile = await this.getUserProfile();
            return profile?.role === "admin";
        }

        static async makeAdmin(userId) {
            const { error } = await SUPABASE
                .from("profiles")
                .update({ role: "admin" })
                .eq("id", userId);

            if (error) throw error;

            await this.logAdminAction("user_role_changed", userId, "user", {
                old_role: "user",
                new_role: "admin"
            });

            return true;
        }

        static async removeAdmin(userId) {
            const { error } = await SUPABASE
                .from("profiles")
                .update({ role: "user" })
                .eq("id", userId);

            if (error) throw error;

            await this.logAdminAction("user_role_changed", userId, "user", {
                old_role: "admin",
                new_role: "user"
            });

            return true;
        }

        static async logAdminAction(action, targetId, targetType, details = {}) {
            const user = await this.checkAuth();
            if (!user) return;

            await SUPABASE
                .from("admin_logs")
                .insert({
                    admin_id: user.id,
                    action,
                    target_id: targetId,
                    target_type: targetType,
                    details: details || {}
                });
        }

        static async initRoleBasedUI() {
            const profile = await this.getUserProfile();

            if (!profile || profile.role !== "admin") {
                const adminBtn = document.getElementById("adminPanelBtn");
                if (adminBtn) adminBtn.style.display = "none";
                return null;
            }

            const adminBtn = document.getElementById("adminPanelBtn");
            if (adminBtn) {
                adminBtn.style.display = "block";
                adminBtn.addEventListener("click", () => {
                    window.location.href = "/admin.html";
                });
            }

            return profile;
        }

        static async logout() {
            const { error } = await SUPABASE.auth.signOut();
            if (error) throw error;
        }
    }

    window.AdminAuth = AdminAuth;
  </script>

  <script>
    // =====================================================================
    // 🌍 Language Manager
    // =====================================================================
    class LanguageManager {
        constructor() {
            this.currentLang = localStorage.getItem('lang') || 'en';
            this.body = document.body;
            this.init();
        }

        init() {
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.addEventListener('click', (e) => this.switchLanguage(e.target.dataset.lang));
            });
            this.applyLanguage();
        }

        switchLanguage(lang) {
            this.currentLang = lang;
            localStorage.setItem('lang', lang);
            this.applyLanguage();
        }

        applyLanguage() {
            this.body.setAttribute('data-lang', this.currentLang);
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.lang === this.currentLang);
            });
        }

        t(key) {
            return translations[this.currentLang][key] || key;
        }
    }

    const translations = {
        en: {
            upload_success: 'File uploaded successfully',
            upload_error: 'Error uploading file',
            delete_success: 'File deleted successfully',
            delete_error: 'Error deleting file',
            delete_confirm: 'Are you sure you want to delete this file?',
            download: 'Download',
            delete: 'Delete',
            no_files: 'No files yet',
            no_files_desc: 'Upload your first file to get started',
            upload_file: 'Upload File',
            uploading: 'Uploading...',
            file_not_selected: 'Please select a file',
            file_size_error: 'File size must be less than 50 MB',
            download_error: 'Error downloading file',
            send_suggestion: 'Send Suggestion',
            suggestion_send_error: 'Error sending suggestion',
            cat_feature: '✨ Feature',
            cat_bug: '🐛 Bug',
            cat_improvement: '🚀 Improvement'
        },
        fa: {
            upload_success: 'فایل با موفقیت آپلود شد',
            upload_error: 'خطا در آپلود فایل',
            delete_success: 'فایل با موفقیت حذف شد',
            delete_error: 'خطا در حذف فایل',
            delete_confirm: 'آیا مطمئن هستید که می‌خواهید این فایل را حذف کنید؟',
            download: 'دانلود',
            delete: 'حذف',
            no_files: 'فایلی وجود ندارد',
            no_files_desc: 'فایل اول خود را آپلود کنید',
            upload_file: 'آپلود فایل',
            uploading: 'در حال آپلود...',
            file_not_selected: 'لطفا یک فایل انتخاب کنید',
            file_size_error: 'اندازه فایل باید کمتر از 50 مگابایت باشد',
            download_error: 'خطا در دانلود فایل',
            send_suggestion: 'ارسال پیشنهاد',
            suggestion_send_error: 'خطا در ارسال پیشنهاد',
            cat_feature: '✨ ویژگی',
            cat_bug: '🐛 باگ',
            cat_improvement: '🚀 بهبود'
        }
    };

    const languageManager = new LanguageManager();
  </script>

  <script>
    // =====================================================================
    // 🎯 UI Logic
    // =====================================================================
    const menuBtn = document.getElementById('menuBtn');
    const dropdownMenu = document.getElementById('dropdownMenu');
    const uploadZone = document.getElementById('uploadZone');
    const fileInput = document.getElementById('fileInput');
    const uploadBtn = document.getElementById('uploadBtn');
    const filesContainer = document.getElementById('filesContainer');
    const messagesContainer = document.getElementById('messagesContainer');
    const suggestionsContainer = document.getElementById('suggestionsContainer');
    const successMsg = document.getElementById('successMsg');
    const errorMsg = document.getElementById('errorMsg');
    const profileName = document.getElementById('profileName');
    const profileEmail = document.getElementById('profileEmail');
    const profileRole = document.getElementById('profileRole');
    const profileAvatar = document.getElementById('profileAvatar');
    const suggestionTitle = document.getElementById('suggestionTitle');
    const suggestionText = document.getElementById('suggestionText');
    const suggestionCategory = document.getElementById('suggestionCategory');
    const sendSuggestionBtn = document.getElementById('sendSuggestionBtn');
    const categoryOptions = document.querySelectorAll('.category-option');
    const categoryLabel = document.querySelector('.category-label');
    const signOutDropdownBtn = document.getElementById('signOutDropdownBtn');

    let currentUser = null;

    // Toggle dropdown menu
    menuBtn.addEventListener('click', () => {
        dropdownMenu.classList.toggle('show');
    });

    document.addEventListener('click', (e) => {
        if (!e.target.closest('.menu-btn') && !e.target.closest('.dropdown-menu')) {
            dropdownMenu.classList.remove('show');
        }
    });

    // Upload zone
    uploadZone.addEventListener('click', () => fileInput.click());
    uploadZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        uploadZone.classList.add('dragover');
    });
    uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('dragover'));
    uploadZone.addEventListener('drop', (e) => {
        e.preventDefault();
        uploadZone.classList.remove('dragover');
        if (e.dataTransfer.files.length > 0) {
            fileInput.files = e.dataTransfer.files;
            fileInput.dispatchEvent(new Event('change', { bubbles: true }));
        }
    });

    // Tab switching
    function switchTab(tabName) {
        document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById(tabName).classList.add('active');
        event.target.classList.add('active');
    }

    // ✅ بهبود Check authentication با retry logic
    async function checkAuth() {
        try {
            // سعی کن تا 3 بار session را بررسی کن (برای اطمینان از creation)
            let user = null;
            for (let i = 0; i < 3; i++) {
                user = await AdminAuth.checkAuth();
                if (user) break;
                if (i < 2) await new Promise(r => setTimeout(r, 300));
            }

            if (!user) {
                window.location.href = '/';
                return;
            }

            const profile = await AdminAuth.getUserProfile();
            currentUser = user;

            if (profile) {
                profileName.textContent = profile.full_name || profile.email || 'User';
                profileEmail.textContent = profile.email;
                profileRole.textContent = `Role: ${profile.role === 'admin' ? '🛡️ Admin' : '👤 User'}`;
                profileAvatar.textContent = (profile.full_name || profile.email || 'U')[0].toUpperCase();
            }

            // Check if user is admin and show admin panel button
            await AdminAuth.initRoleBasedUI();

            // Load initial data
            await loadFiles();
            await loadMessages();
            await loadSuggestions();

        } catch (error) {
            console.error('Auth error:', error);
            window.location.href = '/';
        }
    }

    // Category selection
    categoryOptions.forEach(option => {
        option.addEventListener('click', () => {
            categoryOptions.forEach(o => o.classList.remove('selected'));
            option.classList.add('selected');
            suggestionCategory.value = option.dataset.category;
        });
    });

    // Send suggestion
    sendSuggestionBtn.addEventListener('click', async () => {
        if (!suggestionTitle.value || !suggestionText.value) {
            showError('Please fill in all fields');
            return;
        }

        sendSuggestionBtn.disabled = true;
        sendSuggestionBtn.textContent = languageManager.t('uploading');

        try {
            const { error } = await SUPABASE
                .from('suggestions')
                .insert({
                    user_id: currentUser.id,
                    title: suggestionTitle.value,
                    text: suggestionText.value,
                    category: suggestionCategory.value,
                    created_at: new Date()
                });

            if (error) throw error;

            showSuccess('suggestion_send_error');
            suggestionTitle.value = '';
            suggestionText.value = '';
            suggestionCategory.value = 'feature';
            categoryOptions.forEach(o => o.classList.remove('selected'));
            categoryOptions[0].classList.add('selected');

            await loadSuggestions();
        } catch (err) {
            console.error('Error:', err);
            showError(err.message || 'Error sending suggestion');
        } finally {
            sendSuggestionBtn.disabled = false;
            sendSuggestionBtn.textContent = languageManager.t('send_suggestion');
        }
    });

    // Sign out
    signOutDropdownBtn.addEventListener('click', async () => {
        await AdminAuth.logout();
        window.location.href = '/';
    });

    function showSuccess(keyOrMsg = 'upload_success') {
        const message = translations[languageManager.currentLang][keyOrMsg] || keyOrMsg;
        successMsg.textContent = '✅ ' + message;
        successMsg.classList.add('show');
        setTimeout(() => {
            successMsg.classList.remove('show');
        }, 4000);
    }

    function showError(keyOrMsg = 'upload_error') {
        const message = translations[languageManager.currentLang][keyOrMsg] || keyOrMsg;
        errorMsg.textContent = '❌ ' + message;
        errorMsg.classList.add('show');
        setTimeout(() => {
            errorMsg.classList.remove('show');
        }, 4000);
    }

    // File selection info
    fileInput.addEventListener('change', (e) => {
        const fileSelectedInfo = document.getElementById('fileSelectedInfo');
        const selectedFileName = document.getElementById('selectedFileName');
        
        if (fileInput.files.length > 0) {
            const file = fileInput.files[0];
            selectedFileName.textContent = file.name;
            fileSelectedInfo.classList.add('show');
        } else {
            fileSelectedInfo.classList.remove('show');
        }
    });

    // Upload file
    uploadBtn.addEventListener('click', async () => {
        const file = fileInput.files[0];
        if (!file) {
            showError('file_not_selected');
            return;
        }

        if (file.size > 50 * 1024 * 1024) {
            showError('file_size_error');
            return;
        }

        uploadBtn.disabled = true;
        uploadBtn.textContent = languageManager.t('uploading');

        try {
            const fileName = `${currentUser.id}/${Date.now()}-${file.name}`;

            const { data, error: uploadError } = await SUPABASE
                .storage
                .from('user-files')
                .upload(fileName, file);

            if (uploadError) throw uploadError;

            const { error: dbError } = await SUPABASE
                .from('user_files')
                .insert({
                    user_id: currentUser.id,
                    file_name: file.name,
                    file_size: file.size,
                    file_path: fileName,
                    file_type: file.type,
                    uploaded_at: new Date()
                });

            if (dbError) throw dbError;

            showSuccess('upload_success');
            fileInput.value = '';
            
            const fileSelectedInfo = document.getElementById('fileSelectedInfo');
            fileSelectedInfo.classList.remove('show');
            
            await loadFiles();
        } catch (err) {
            console.error('Error:', err);
            showError('upload_error');
        } finally {
            uploadBtn.disabled = false;
            uploadBtn.textContent = languageManager.t('upload_file');
        }
    });

    async function loadFiles() {
        try {
            const { data, error } = await SUPABASE
                .from('user_files')
                .select('*')
                .eq('user_id', currentUser.id)
                .order('uploaded_at', { ascending: false });

            if (error) throw error;

            displayFiles(data || []);
        } catch (err) {
            console.error('Error loading files:', err);
        }
    }

    function displayFiles(files) {
        if (files.length === 0) {
            filesContainer.innerHTML = `
              <div class="empty-state">
                <div class="empty-state-icon">📭</div>
                <h3>${languageManager.t('no_files')}</h3>
                <p>${languageManager.t('no_files_desc')}</p>
              </div>
            `;
            return;
        }

        const getFileIcon = (fileName) => {
            const ext = fileName.split('.').pop().toLowerCase();
            const icons = {
                'pdf': '📄', 'doc': '📝', 'docx': '📝',
                'xls': '📊', 'xlsx': '📊', 'ppt': '🎬', 'pptx': '🎬',
                'jpg': '🖼️', 'jpeg': '🖼️', 'png': '🖼️', 'gif': '🖼️',
                'zip': '🗜️', 'rar': '🗜️', 'txt': '📋',
                'mp3': '🎵', 'mp4': '🎬', 'avi': '🎬', 'mkv': '🎬'
            };
            return icons[ext] || '📎';
        };

        const formatFileSize = (bytes) => {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
        };

        filesContainer.innerHTML = files.map(file => {
            const date = new Date(file.uploaded_at);
            const dateStr = date.toLocaleDateString('en-US', {
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });

            const timeStr = date.toLocaleTimeString('en-US', {
                hour: '2-digit',
                minute: '2-digit'
            });

            return `
              <div class="file-item">
                <div class="file-item-info">
                  <div class="file-item-icon">${getFileIcon(file.file_name)}</div>
                  <div class="file-item-details">
                    <p class="file-item-name">${file.file_name}</p>
                    <div class="file-item-meta">
                      <span>${formatFileSize(file.file_size)}</span>
                      <span>•</span>
                      <span>${dateStr}</span>
                      <span>•</span>
                      <span>${timeStr}</span>
                    </div>
                  </div>
                </div>
                <div class="file-item-actions">
                  <button class="file-btn" onclick="downloadFile('${file.file_path}', '${file.file_name}')">${languageManager.t('download')}</button>
                  <button class="file-btn delete" onclick="deleteFile('${file.id}', '${file.file_path}')">${languageManager.t('delete')}</button>
                </div>
              </div>
            `;
        }).join('');
    }

    async function downloadFile(filePath, fileName) {
        try {
            const { data, error } = await SUPABASE
                .storage
                .from('user-files')
                .download(filePath);

            if (error) throw error;

            const url = URL.createObjectURL(data);
            const a = document.createElement('a');
            a.href = url;
            a.download = fileName;
            a.click();
            URL.revokeObjectURL(url);
        } catch (err) {
            console.error('Error:', err);
            showError('download_error');
        }
    }

    async function deleteFile(fileId, filePath) {
        if (!confirm(languageManager.t('delete_confirm'))) {
            return;
        }

        try {
            const { error: storageError } = await SUPABASE
                .storage
                .from('user-files')
                .remove([filePath]);

            if (storageError) throw storageError;

            const { error: dbError } = await SUPABASE
                .from('user_files')
                .delete()
                .eq('id', fileId);

            if (dbError) throw dbError;

            showSuccess('delete_success');
            await loadFiles();
        } catch (err) {
            console.error('Error:', err);
            showError('delete_error');
        }
    }

    async function loadMessages() {
        // Placeholder for loading messages
        messagesContainer.innerHTML = '<p style="color: var(--muted);">No messages yet</p>';
    }

    async function loadSuggestions() {
        try {
            const { data, error } = await SUPABASE
                .from('suggestions')
                .select('*')
                .eq('user_id', currentUser.id)
                .order('created_at', { ascending: false });

            if (error) throw error;

            if (data && data.length > 0) {
                suggestionsContainer.innerHTML = data.map(s => `
                  <div class="message-item">
                    <div class="message-header">
                      <span class="message-author">${s.title}</span>
                      <span class="message-time">${new Date(s.created_at).toLocaleDateString()}</span>
                    </div>
                    <p class="message-text">${s.text}</p>
                  </div>
                `).join('');
            } else {
                suggestionsContainer.innerHTML = '<p style="color: var(--muted);">No suggestions yet</p>';
            }
        } catch (err) {
            console.error('Error loading suggestions:', err);
        }
    }

    function toggleLanguage() {
        const newLang = languageManager.currentLang === 'en' ? 'fa' : 'en';
        languageManager.switchLanguage(newLang);
    }

    // Initialize
    checkAuth();
  </script>
