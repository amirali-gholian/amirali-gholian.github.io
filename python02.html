<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دوره Python | Amirali Gholian</title>
  <link rel="icon" href="./logo.png" type="image/png">
  
  <style>
    :root {
      --bg0: #050814;
      --bg1: #070b16;
      --panel: rgba(15, 23, 42, .72);
      --line: rgba(148, 163, 184, .16);
      --text: #e5e7eb;
      --muted: #94a3b8;
      --soft: #cbd5e1;
      --accent: #38bdf8;
      --accent-2: #22c55e;
      --accent-3: #a78bfa;
      --shadow: 0 20px 60px rgba(0, 0, 0, .42);
      --radius: 26px;
      --max: 1180px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: 
        radial-gradient(circle at top left, rgba(56,189,248,.14), transparent 28%),
        radial-gradient(circle at top right, rgba(167,139,250,.12), transparent 24%),
        linear-gradient(180deg, var(--bg0), var(--bg1) 55%, #04060b 100%);
      color: var(--text);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: var(--max);
      margin: 0 auto;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 48px;
    }

    .back-btn {
      padding: 10px 16px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, .15);
      background: rgba(255, 255, 255, .08);
      color: var(--text);
      cursor: pointer;
      font-family: inherit;
      font-size: .95rem;
      font-weight: 500;
      transition: all .25s ease;
    }

    .back-btn:hover {
      background: rgba(255, 255, 255, .12);
      border-color: rgba(255, 255, 255, .2);
    }

    .course-title {
      margin: 0;
      font-size: 2rem;
      background: linear-gradient(135deg, #fff, var(--soft));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .course-subtitle {
      color: var(--muted);
      font-size: 1rem;
      margin-top: 4px;
    }

    /* Levels Grid */
    .levels-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 24px;
      margin-bottom: 64px;
    }

    .level-card {
      background: var(--panel);
      border: 1px solid rgba(56, 189, 248, .2);
      border-radius: var(--radius);
      padding: 32px;
      transition: all .3s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .level-card:hover {
      transform: translateY(-8px);
      border-color: rgba(56, 189, 248, .4);
      box-shadow: 0 20px 60px rgba(56, 189, 248, .1);
    }

    .level-header {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .level-icon {
      font-size: 2.4rem;
    }

    .level-info h3 {
      margin: 0;
      font-size: 1.4rem;
      color: #fff;
    }

    .level-info p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: .9rem;
    }

    .level-stats {
      display: flex;
      gap: 16px;
      padding: 16px;
      background: rgba(255, 255, 255, .04);
      border-radius: 12px;
    }

    .stat {
      flex: 1;
      text-align: center;
    }

    .stat-value {
      display: block;
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 4px;
    }

    .stat-label {
      display: block;
      font-size: .85rem;
      color: var(--muted);
    }

    .level-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .start-btn {
      padding: 14px 24px;
      border-radius: 12px;
      border: 1px solid transparent;
      background: linear-gradient(135deg, var(--accent), rgba(56, 189, 248, .8));
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      font-size: 1rem;
      transition: all .25s ease;
    }

    .start-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(56, 189, 248, .25);
    }

    .start-btn:active {
      transform: translateY(0);
    }

    .history-btn {
      padding: 10px 16px;
      border-radius: 10px;
      border: 1px solid rgba(56, 189, 248, .3);
      background: rgba(56, 189, 248, .1);
      color: var(--accent);
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      font-size: .9rem;
      transition: all .25s ease;
    }

    .history-btn:hover {
      background: rgba(56, 189, 248, .15);
      border-color: rgba(56, 189, 248, .5);
    }

    /* History Section */
    .history-section {
      margin-top: 64px;
      padding-top: 32px;
      border-top: 1px solid var(--line);
    }

    .section-title {
      font-size: 1.6rem;
      margin: 0 0 24px;
      color: #fff;
    }

    .history-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
    }

    .history-item {
      background: rgba(15, 23, 42, .5);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all .25s ease;
    }

    .history-item:hover {
      background: rgba(15, 23, 42, .7);
      border-color: rgba(56, 189, 248, .2);
    }

    .history-info h4 {
      margin: 0;
      font-size: 1.1rem;
      color: #fff;
    }

    .history-info p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: .85rem;
    }

    .history-score {
      font-size: 1.8rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent-2), rgba(34, 197, 94, .6));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--muted);
    }

    .empty-state-icon {
      font-size: 3rem;
      margin-bottom: 16px;
    }

    .empty-state h3 {
      color: var(--text);
      margin: 0 0 8px;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .course-title {
        font-size: 1.6rem;
      }

      .levels-grid {
        grid-template-columns: 1fr;
      }

      .level-card {
        padding: 24px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <button class="back-btn" onclick="goBack()">← بازگشت</button>
      <div>
        <h1 class="course-title">🐍 Python</h1>
        <p class="course-subtitle">برنامه‌نویسی برای شروع‌کننده‌ها</p>
      </div>
    </div>

    <!-- Levels -->
    <div class="levels-grid">
      <!-- Beginner -->
      <div class="level-card">
        <div class="level-header">
          <span class="level-icon">🌱</span>
          <div class="level-info">
            <h3>مقدماتی</h3>
            <p>آغاز یادگیری</p>
          </div>
        </div>
        <div class="level-stats">
          <div class="stat">
            <span class="stat-value">10</span>
            <span class="stat-label">سوال</span>
          </div>
          <div class="stat">
            <span class="stat-value">15</span>
            <span class="stat-label">دقیقه</span>
          </div>
          <div class="stat">
            <span class="stat-value" id="beginner-score">—</span>
            <span class="stat-label">نمره</span>
          </div>
        </div>
        <div class="level-actions">
          <button class="start-btn" onclick="startExam('beginner')">شروع آزمون</button>
          <button class="history-btn" onclick="viewLevelHistory('beginner')">تاریخچه</button>
        </div>
      </div>

      <!-- Intermediate -->
      <div class="level-card">
        <div class="level-header">
          <span class="level-icon">🎯</span>
          <div class="level-info">
            <h3>متوسط</h3>
            <p>تقویت مهارت‌ها</p>
          </div>
        </div>
        <div class="level-stats">
          <div class="stat">
            <span class="stat-value">10</span>
            <span class="stat-label">سوال</span>
          </div>
          <div class="stat">
            <span class="stat-value">20</span>
            <span class="stat-label">دقیقه</span>
          </div>
          <div class="stat">
            <span class="stat-value" id="intermediate-score">—</span>
            <span class="stat-label">نمره</span>
          </div>
        </div>
        <div class="level-actions">
          <button class="start-btn" onclick="startExam('intermediate')">شروع آزمون</button>
          <button class="history-btn" onclick="viewLevelHistory('intermediate')">تاریخچه</button>
        </div>
      </div>

      <!-- Advanced -->
      <div class="level-card">
        <div class="level-header">
          <span class="level-icon">🚀</span>
          <div class="level-info">
            <h3>پیشرفته</h3>
            <p>تسلط کامل</p>
          </div>
        </div>
        <div class="level-stats">
          <div class="stat">
            <span class="stat-value">10</span>
            <span class="stat-label">سوال</span>
          </div>
          <div class="stat">
            <span class="stat-value">25</span>
            <span class="stat-label">دقیقه</span>
          </div>
          <div class="stat">
            <span class="stat-value" id="advanced-score">—</span>
            <span class="stat-label">نمره</span>
          </div>
        </div>
        <div class="level-actions">
          <button class="start-btn" onclick="startExam('advanced')">شروع آزمون</button>
          <button class="history-btn" onclick="viewLevelHistory('advanced')">تاریخچه</button>
        </div>
      </div>
    </div>

    <!-- History Section -->
    <div class="history-section">
      <h2 class="section-title" id="historyTitle">📊 تاریخچه آزمون‌ها</h2>
      <div id="historyContainer">
        <div class="empty-state">
          <div class="empty-state-icon">📭</div>
          <h3>هنوز امتحانی انجام نشده است</h3>
          <p>یکی از آزمون‌های بالا را انجام دهید</p>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0"></script>
  <script>
    // ============ تنظیمات Supabase ============
    const SUPABASE = window.supabase.createClient(
      'https://cwwqmushilpxzpcpjute.supabase.co',
      'sb_publishable__AzVitbAoaYfEyvJMnIkkQ_AOkXCfbK'
    );

    let currentUser = null;
    let allExamResults = [];

    // Check Authentication
    async function checkAuth() {
      try {
        const { data: { session } } = await SUPABASE.auth.getSession();
        if (!session) {
          window.location.href = './profile.html';
          return;
        }
        currentUser = session.user;
        loadScores();
      } catch (err) {
        console.error('خطا:', err);
        window.location.href = './profile.html';
      }
    }

    // Load scores and history
    async function loadScores() {
      if (!currentUser) return;

      try {
        const { data, error } = await SUPABASE
          .from('exam_results')
          .select('*')
          .eq('user_id', currentUser.id)
          .eq('course', 'Python')
          .order('created_at', { ascending: false });

        if (error) throw error;

        if (data && data.length > 0) {
          allExamResults = data;
          // Update score badges - best score for each level
          const levels = ['beginner', 'intermediate', 'advanced'];
          levels.forEach(level => {
            const levelResults = data.filter(r => r.level === level);
            if (levelResults.length > 0) {
              const bestScore = Math.max(...levelResults.map(r => r.score));
              document.getElementById(`${level}-score`).textContent = bestScore;
            }
          });

          // Display history - last 10 attempts
          displayHistory(data);
        }
      } catch (err) {
        console.error('خطا در بارگیری داده‌ها:', err);
      }
    }

    // Display history
    function displayHistory(data) {
      if (data.length === 0) return;

      const sorted = data.slice(0, 10); // Show last 10
      const html = sorted.map(exam => {
        const date = new Date(exam.created_at);
        const dateStr = date.toLocaleDateString('fa-IR', {
          year: 'numeric',
          month: 'short',
          day: 'numeric',
          hour: '2-digit',
          minute: '2-digit'
        });

        const levelEmoji = {
          beginner: '🌱',
          intermediate: '🎯',
          advanced: '🚀'
        }[exam.level] || '';

        const levelName = {
          beginner: 'مقدماتی',
          intermediate: 'متوسط',
          advanced: 'پیشرفته'
        }[exam.level] || '';

        return `
          <div class="history-item">
            <div class="history-info">
              <h4>${levelEmoji} ${levelName} - ${exam.correct_answers}/10 ✓</h4>
              <p>${dateStr}</p>
            </div>
            <div class="history-score">${exam.score}</div>
          </div>
        `;
      }).join('');

      document.getElementById('historyContainer').innerHTML = html;
    }

    // Start exam
    function startExam(level) {
      window.location.href = `./exam.html?course=Python&level=${level}`;
    }

    // View level history
    function viewLevelHistory(level) {
      const levelNames = {
        beginner: '🌱 مقدماتی',
        intermediate: '🎯 متوسط',
        advanced: '🚀 پیشرفته'
      };

      const filtered = allExamResults.filter(e => e.level === level);

      document.getElementById('historyTitle').innerHTML = `
        📊 تاریخچه سطح ${levelNames[level] || level}
        <button onclick="showAllHistory()" style="margin-right:12px; padding:6px 14px; border-radius:8px; border:1px solid rgba(56,189,248,.3); background:rgba(56,189,248,.1); color:var(--accent); font-family:inherit; font-size:.85rem; cursor:pointer;">نمایش همه</button>
      `;

      if (filtered.length === 0) {
        document.getElementById('historyContainer').innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">📭</div>
            <h3>هنوز آزمونی برای این سطح انجام نشده</h3>
          </div>
        `;
      } else {
        displayHistory(filtered);
      }

      document.getElementById('historyContainer').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    // Show all history again
    function showAllHistory() {
      document.getElementById('historyTitle').textContent = '📊 تاریخچه آزمون‌ها';
      if (allExamResults.length > 0) {
        displayHistory(allExamResults);
      }
    }

    // Go back
    function goBack() {
      window.location.href = './profile.html';
    }

    // Initialize
    checkAuth();
  </script>
</body>
</html>
