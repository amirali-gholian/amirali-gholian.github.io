<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Python Course | Amirali Gholian</title>
  <link rel="icon" href="./logo.webp" type="image/png">
  
  <style>
    :root {
      --bg0: #050814;
      --bg1: #070b16;
      --panel: rgba(15, 23, 42, .72);
      --line: rgba(148, 163, 184, .16);
      --text: #e5e7eb;
      --muted: #94a3b8;
      --soft: #cbd5e1;
      --accent: #38bdf8;
      --accent-2: #22c55e;
      --accent-3: #a78bfa;
      --shadow: 0 20px 60px rgba(0, 0, 0, .42);
      --radius: 26px;
      --max: 1180px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: 
        radial-gradient(circle at top left, rgba(56,189,248,.14), transparent 28%),
        radial-gradient(circle at top right, rgba(167,139,250,.12), transparent 24%),
        linear-gradient(180deg, var(--bg0), var(--bg1) 55%, #04060b 100%);
      color: var(--text);
      min-height: 100vh;
      padding: 20px;
    }

    /* Topbar */
    .topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 40;
      background: rgba(4, 8, 15, .62);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255, 255, 255, .08);
      box-shadow: 0 4px 16px rgba(0, 0, 0, .2);
      padding: 12px 20px;
    }

    .topbar-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: var(--max);
      margin: 0 auto;
      width: 100%;
    }

    .lang-btn {
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, .15);
      background: rgba(56, 189, 248, .1);
      color: var(--accent);
      cursor: pointer;
      transition: all .25s ease;
      font-size: .85rem;
      font-family: inherit;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .lang-btn:hover {
      background: rgba(56, 189, 248, .2);
      border-color: var(--accent);
    }

    .lang-btn.active {
      background: linear-gradient(135deg, var(--accent), rgba(56, 189, 248, .3));
      border-color: var(--accent);
      color: #fff;
    }

    .container {
      max-width: var(--max);
      margin: 0 auto;
      margin-top: 80px;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 48px;
      flex-wrap: wrap;
    }

    .back-btn {
      padding: 10px 16px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, .15);
      background: rgba(255, 255, 255, .08);
      color: var(--text);
      cursor: pointer;
      font-family: inherit;
      font-size: .95rem;
      font-weight: 500;
      transition: all .25s ease;
    }

    .back-btn:hover {
      background: rgba(255, 255, 255, .12);
      border-color: rgba(255, 255, 255, .2);
    }

    .header-content {
      flex: 1;
    }

    .course-title {
      margin: 0;
      font-size: 2rem;
      background: linear-gradient(135deg, #fff, var(--soft));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .course-subtitle {
      color: var(--muted);
      font-size: 1rem;
      margin-top: 4px;
    }

    /* Levels Grid */
    .levels-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 24px;
      margin-bottom: 64px;
    }

    .level-card {
      background: var(--panel);
      border: 1px solid rgba(56, 189, 248, .2);
      border-radius: var(--radius);
      padding: 32px;
      transition: all .3s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .level-card:hover {
      transform: translateY(-8px);
      border-color: rgba(56, 189, 248, .4);
      box-shadow: 0 20px 60px rgba(56, 189, 248, .1);
    }

    .level-header {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .level-icon {
      font-size: 2.4rem;
    }

    .level-info h3 {
      margin: 0;
      font-size: 1.4rem;
      color: #fff;
    }

    .level-info p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: .9rem;
    }

    .level-stats {
      display: flex;
      gap: 16px;
      padding: 16px;
      background: rgba(255, 255, 255, .04);
      border-radius: 12px;
    }

    .stat {
      flex: 1;
      text-align: center;
    }

    .stat-value {
      display: block;
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 4px;
    }

    .stat-label {
      display: block;
      font-size: .85rem;
      color: var(--muted);
    }

    .level-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .start-btn {
      padding: 14px 24px;
      border-radius: 12px;
      border: 1px solid transparent;
      background: linear-gradient(135deg, var(--accent), rgba(56, 189, 248, .8));
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      font-size: 1rem;
      transition: all .25s ease;
    }

    .start-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(56, 189, 248, .25);
    }

    .history-btn {
      padding: 10px 16px;
      border-radius: 10px;
      border: 1px solid rgba(56, 189, 248, .3);
      background: rgba(56, 189, 248, .1);
      color: var(--accent);
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      font-size: .9rem;
      transition: all .25s ease;
    }

    .history-btn:hover {
      background: rgba(56, 189, 248, .15);
      border-color: rgba(56, 189, 248, .5);
    }

    /* History Section */
    .history-section {
      margin-top: 64px;
      padding-top: 32px;
      border-top: 1px solid var(--line);
    }

    .section-title {
      font-size: 1.6rem;
      margin: 0 0 24px;
      color: #fff;
    }

    .history-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
    }

    .history-item {
      background: rgba(15, 23, 42, .5);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all .25s ease;
    }

    .history-item:hover {
      background: rgba(15, 23, 42, .7);
      border-color: rgba(56, 189, 248, .2);
    }

    .history-info h4 {
      margin: 0;
      font-size: 1.1rem;
      color: #fff;
    }

    .history-info p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: .85rem;
    }

    .history-score {
      font-size: 1.8rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent-2), rgba(34, 197, 94, .6));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--muted);
    }

    .empty-state-icon {
      font-size: 3rem;
      margin-bottom: 16px;
    }

    .empty-state h3 {
      color: var(--text);
      margin: 0 0 8px;
    }

    /* Chart Section */
    .chart-section {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 28px;
      margin-bottom: 36px;
    }

    .chart-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 8px;
    }

    .chart-header .section-title {
      margin: 0;
    }

    .chart-subtitle {
      color: var(--muted);
      font-size: .85rem;
      margin: 4px 0 20px;
    }

    .chart-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 4px;
      background: rgba(255, 255, 255, .03);
      border: 1px solid var(--line);
      border-radius: 12px;
    }

    .chart-tab {
      padding: 8px 16px;
      border-radius: 9px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--muted);
      font-family: inherit;
      font-size: .85rem;
      font-weight: 500;
      cursor: pointer;
      transition: all .2s ease;
      white-space: nowrap;
    }

    .chart-tab:hover {
      color: var(--text);
      background: rgba(255, 255, 255, .05);
    }

    .chart-tab.active {
      background: linear-gradient(135deg, var(--accent), rgba(56, 189, 248, .75));
      color: #fff;
      box-shadow: 0 6px 18px rgba(56, 189, 248, .25);
    }

    .chart-stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 12px;
      margin: 20px 0;
    }

    .chart-stat-card {
      background: rgba(255, 255, 255, .04);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px 16px;
      text-align: center;
    }

    .chart-stat-value {
      display: block;
      font-size: 1.3rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 2px;
    }

    .chart-stat-value.trend-up { color: var(--accent-2); }
    .chart-stat-value.trend-down { color: #f87171; }
    .chart-stat-value.trend-flat { color: var(--muted); }

    .chart-stat-label {
      display: block;
      font-size: .78rem;
      color: var(--muted);
    }

    .chart-wrapper {
      position: relative;
      width: 100%;
      height: 340px;
      margin-top: 8px;
      display: none;
    }

    .chart-empty {
      display: block;
    }

    @media (max-width: 768px) {
      .course-title {
        font-size: 1.6rem;
      }

      .levels-grid {
        grid-template-columns: 1fr;
      }

      .level-card {
        padding: 24px;
      }

      .chart-wrapper {
        height: 280px;
      }
    }
  </style>
</head>
<body>
  <!-- Topbar -->
  <div class="topbar">
    <div class="topbar-inner">
      <div></div>
      <div style="display: flex; gap: 8px;">
        <button class="lang-btn active" id="langBtnEn" onclick="pythonSystem.setLanguage('en')">EN</button>
        <button class="lang-btn" id="langBtnFa" onclick="pythonSystem.setLanguage('fa')">FA</button>
      </div>
    </div>
  </div>

  <div class="container">
    <!-- Header -->
    <div class="header">
      <button class="back-btn" onclick="pythonSystem.goBack()" id="backBtnText">← Back</button>
      <div class="header-content">
        <h1 class="course-title">🐍 Python</h1>
        <p class="course-subtitle" id="courseSubtitle">Programming for beginners</p>
      </div>
    </div>

    <!-- Levels -->
    <div class="levels-grid" id="levelsGrid"></div>

    <!-- Progress Chart Section -->
    <div class="chart-section">
      <div class="chart-header">
        <div>
          <h2 class="section-title" id="progressTitle">📈 Progress</h2>
          <p class="chart-subtitle" id="progressSubtitle">Your scores over time — overall or for each level separately</p>
        </div>
        <div class="chart-tabs" id="chartTabs">
          <button class="chart-tab active" data-level="all">All Levels</button>
          <button class="chart-tab" data-level="beginner">🌱 Beginner</button>
          <button class="chart-tab" data-level="intermediate">🎯 Intermediate</button>
          <button class="chart-tab" data-level="advanced">🚀 Advanced</button>
        </div>
      </div>

      <div class="chart-stats" id="chartStats"></div>

      <div class="chart-wrapper" id="chartWrapper">
        <canvas id="progressChart"></canvas>
      </div>

      <div class="chart-empty" id="chartEmpty">
        <div class="empty-state">
          <div class="empty-state-icon">📈</div>
          <h3 id="emptyChartTitle">No data for chart yet</h3>
          <p id="emptyChartDesc">After taking the first exam, your progress will be shown here</p>
        </div>
      </div>
    </div>

    <!-- History Section -->
    <div class="history-section">
      <h2 class="section-title" id="historyTitle">📊 Exam History</h2>
      <div id="historyContainer">
        <div class="empty-state">
          <div class="empty-state-icon">📭</div>
          <h3 id="emptyHistoryTitle">No exams taken yet</h3>
          <p id="emptyHistoryDesc">Take one of the exams above</p>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
  <script>
    class PythonSystem {
      constructor() {
        this.SUPABASE = null;
        this.currentUser = null;
        this.allExamResults = [];
        this.currentChartLevel = 'all';
        this.progressChart = null;
        this.currentLang = localStorage.getItem('examLang') || 'en';

        this.text = {
          en: {
            back: '← Back',
            courseTitle: '🐍 Python',
            courseSubtitle: 'Programming for beginners',
            beginner: 'Beginner',
            intermediate: 'Intermediate',
            advanced: 'Advanced',
            startFresh: 'Start Fresh',
            startExam: 'Start Exam',
            viewHistory: 'View History',
            questions: 'Questions',
            time: 'Time',
            score: 'Score',
            noExamsTaken: 'No exams taken yet',
            takeOneExam: 'Take one of the exams above',
            progress: '📈 Progress',
            progressSubtitle: 'Your scores over time — overall or for each level separately',
            allLevels: 'All Levels',
            noChartData: 'No data for chart yet',
            afterFirstExam: 'After taking the first exam, your progress will be shown here',
            examHistory: '📊 Exam History',
            examCount: 'Exams',
            bestScore: 'Best Score',
            avgScore: 'Average Score',
            trend: 'Change from first exam',
            noLevel: 'No exams taken for this level'
          },
          fa: {
            back: '← بازگشت',
            courseTitle: '🐍 Python',
            courseSubtitle: 'برنامه‌نویسی برای شروع‌کننده‌ها',
            beginner: 'مقدماتی',
            intermediate: 'متوسط',
            advanced: 'پیشرفته',
            startFresh: 'شروع نو',
            startExam: 'شروع آزمون',
            viewHistory: 'تاریخچه',
            questions: 'سوال',
            time: 'دقیقه',
            score: 'نمره',
            noExamsTaken: 'هنوز امتحانی انجام نشده است',
            takeOneExam: 'یکی از آزمون‌های بالا را انجام دهید',
            progress: '📈 روند پیشرفت',
            progressSubtitle: 'نمره‌های شما در طول زمان — به صورت کلی یا برای هر سطح جداگانه',
            allLevels: 'همه سطوح',
            noChartData: 'هنوز داده‌ای برای نمودار وجود ندارد',
            afterFirstExam: 'پس از انجام اولین آزمون، روند پیشرفت شما اینجا نمایش داده می‌شود',
            examHistory: '📊 تاریخچه آزمون‌ها',
            examCount: 'تعداد آزمون',
            bestScore: 'بهترین نمره',
            avgScore: 'میانگین نمره',
            trend: 'تغییر نسبت به اولین آزمون',
            noLevel: 'هنوز آزمونی برای این سطح انجام نشده'
          }
        };

        this.levelConfig = {
          en: {
            beginner: { emoji: '🌱', name: 'Beginner', subtitle: 'Get started', color: '#22c55e', questions: 10, time: 15 },
            intermediate: { emoji: '🎯', name: 'Intermediate', subtitle: 'Strengthen skills', color: '#f59e0b', questions: 10, time: 20 },
            advanced: { emoji: '🚀', name: 'Advanced', subtitle: 'Full mastery', color: '#a78bfa', questions: 10, time: 25 }
          },
          fa: {
            beginner: { emoji: '🌱', name: 'مقدماتی', subtitle: 'آغاز یادگیری', color: '#22c55e', questions: 10, time: 15 },
            intermediate: { emoji: '🎯', name: 'متوسط', subtitle: 'تقویت مهارت‌ها', color: '#f59e0b', questions: 10, time: 20 },
            advanced: { emoji: '🚀', name: 'پیشرفته', subtitle: 'تسلط کامل', color: '#a78bfa', questions: 10, time: 25 }
          }
        };
      }

      setLanguage(lang) {
        this.currentLang = lang;
        localStorage.setItem('examLang', lang);
        
        document.documentElement.lang = lang;
        document.documentElement.dir = lang === 'fa' ? 'rtl' : 'ltr';
        
        document.getElementById('langBtnEn').classList.toggle('active', lang === 'en');
        document.getElementById('langBtnFa').classList.toggle('active', lang === 'fa');
        
        this.render();
      }

      async init() {
        this.setLanguage(this.currentLang);
        this.initSupabase();
        await this.loadExamResults();
        this.render();
      }

      initSupabase() {
        const supabaseUrl = 'https://mkazouyufagfttllbsqf.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1rYXpvdXl1ZmFnZnR0bGxic3FmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MDcyNzI5ODgsImV4cCI6MjAyMjg0ODk4OH0.ZHgCkGIYQfkIKx9u-k4w2gN1F3qRBvGlR72ChfCVKBU';

        this.SUPABASE = window.supabase.createClient(supabaseUrl, supabaseKey);
        this.checkAuth();
      }

      async checkAuth() {
        try {
          const { data } = await this.SUPABASE.auth.getUser();
          this.currentUser = data.user;
        } catch (err) {
          console.error('Auth error:', err);
        }
      }

      async loadExamResults() {
        if (!this.SUPABASE || !this.currentUser) return;

        try {
          const { data, error } = await this.SUPABASE
            .from('exam_results')
            .select('*')
            .eq('user_id', this.currentUser.id)
            .eq('course', 'Python')
            .order('created_at', { ascending: false });

          if (!error) {
            this.allExamResults = data || [];
          }
        } catch (err) {
          console.error('Error loading results:', err);
        }
      }

      render() {
        const t = this.text[this.currentLang];
        const levels = this.levelConfig[this.currentLang];

        // Update header
        document.getElementById('backBtnText').textContent = t.back;
        document.getElementById('courseSubtitle').textContent = t.courseSubtitle;

        // Render level cards
        const grid = document.getElementById('levelsGrid');
        grid.innerHTML = Object.entries(levels).map(([key, level]) => {
          const lastScore = this.allExamResults.find(e => e.level === key)?.score || '—';
          
          return `
            <div class="level-card">
              <div class="level-header">
                <div class="level-icon">${level.emoji}</div>
                <div class="level-info">
                  <h3>${level.name}</h3>
                  <p>${level.subtitle}</p>
                </div>
              </div>
              <div class="level-stats">
                <div class="stat">
                  <span class="stat-value">${level.questions}</span>
                  <span class="stat-label">${t.questions}</span>
                </div>
                <div class="stat">
                  <span class="stat-value">${level.time}</span>
                  <span class="stat-label">${t.time}</span>
                </div>
                <div class="stat">
                  <span class="stat-value">${lastScore}</span>
                  <span class="stat-label">${t.score}</span>
                </div>
              </div>
              <div class="level-actions">
                <button class="start-btn" onclick="pythonSystem.startExam('${key}')">
                  ${t.startExam}
                </button>
                <button class="history-btn" onclick="pythonSystem.viewLevelHistory('${key}')">
                  📊 ${t.viewHistory}
                </button>
              </div>
            </div>
          `;
        }).join('');

        // Update chart section
        document.getElementById('progressTitle').textContent = t.progress;
        document.getElementById('progressSubtitle').textContent = t.progressSubtitle;
        document.getElementById('emptyChartTitle').textContent = t.noChartData;
        document.getElementById('emptyChartDesc').textContent = t.afterFirstExam;

        // Update history section
        document.getElementById('historyTitle').textContent = t.examHistory;
        document.getElementById('emptyHistoryTitle').textContent = t.noExamsTaken;
        document.getElementById('emptyHistoryDesc').textContent = t.takeOneExam;

        // Update chart tabs
        const chartTabs = document.getElementById('chartTabs');
        const tabLabels = {
          all: t.allLevels,
          beginner: `${levels.beginner.emoji} ${levels.beginner.name}`,
          intermediate: `${levels.intermediate.emoji} ${levels.intermediate.name}`,
          advanced: `${levels.advanced.emoji} ${levels.advanced.name}`
        };

        chartTabs.innerHTML = Object.entries(tabLabels).map(([key, label]) => `
          <button class="chart-tab ${key === 'all' ? 'active' : ''}" data-level="${key}">
            ${label}
          </button>
        `).join('');

        // Re-attach chart tab listener
        chartTabs.removeEventListener('click', this.chartTabListener);
        this.chartTabListener = (e) => {
          const btn = e.target.closest('.chart-tab');
          if (!btn) return;
          document.querySelectorAll('.chart-tab').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          this.renderChart(btn.dataset.level);
        };
        chartTabs.addEventListener('click', this.chartTabListener);

        // Render history
        this.displayHistory(this.allExamResults);

        // Initial chart
        this.renderChart('all');
      }

      displayHistory(exams) {
        const t = this.text[this.currentLang];
        const levels = this.levelConfig[this.currentLang];

        if (exams.length === 0) {
          document.getElementById('historyContainer').innerHTML = `
            <div class="empty-state">
              <div class="empty-state-icon">📭</div>
              <h3>${t.noExamsTaken}</h3>
              <p>${t.takeOneExam}</p>
            </div>
          `;
          return;
        }

        const html = exams.map(exam => {
          const level = levels[exam.level];
          const date = new Date(exam.created_at);
          const dateStr = date.toLocaleDateString(this.currentLang === 'fa' ? 'fa-IR' : 'en-US', {
            year: 'numeric',
            month: 'long',
            day: 'numeric'
          });

          return `
            <div class="history-item">
              <div class="history-info">
                <h4>${level.emoji} ${level.name} - ${exam.correct_answers}/10 ✓</h4>
                <p>${dateStr}</p>
              </div>
              <div class="history-score">${exam.score}</div>
            </div>
          `;
        }).join('');

        document.getElementById('historyContainer').innerHTML = html;
      }

      renderChart(levelFilter) {
        const wrapper = document.getElementById('chartWrapper');
        const emptyEl = document.getElementById('chartEmpty');

        const source = levelFilter === 'all' 
          ? this.allExamResults 
          : this.allExamResults.filter(e => e.level === levelFilter);

        if (source.length === 0) {
          wrapper.style.display = 'none';
          emptyEl.style.display = 'block';
          if (this.progressChart) { 
            this.progressChart.destroy(); 
            this.progressChart = null; 
          }
          this.updateChartStats(levelFilter);
          return;
        }

        wrapper.style.display = 'block';
        emptyEl.style.display = 'none';
        this.updateChartStats(levelFilter);

        const levels = this.levelConfig[this.currentLang];
        let datasets = [];

        if (levelFilter === 'all') {
          Object.keys(levels).forEach(lvl => {
            const points = this.allExamResults
              .filter(e => e.level === lvl)
              .sort((a, b) => new Date(a.created_at) - new Date(b.created_at))
              .map(e => ({ x: new Date(e.created_at), y: e.score }));

            if (points.length > 0) {
              datasets.push({
                label: `${levels[lvl].emoji} ${levels[lvl].name}`,
                data: points,
                borderColor: levels[lvl].color,
                backgroundColor: levels[lvl].color + '26',
                borderWidth: 3,
                tension: 0.35
              });
            }
          });
        } else {
          const points = this.allExamResults
            .filter(e => e.level === levelFilter)
            .sort((a, b) => new Date(a.created_at) - new Date(b.created_at))
            .map(e => ({ x: new Date(e.created_at), y: e.score }));

          const cfg = levels[levelFilter];
          datasets.push({
            label: `${cfg.emoji} ${cfg.name}`,
            data: points,
            borderColor: cfg.color,
            backgroundColor: cfg.color + '33',
            borderWidth: 3,
            tension: 0.35,
            fill: true
          });
        }

        const ctx = document.getElementById('progressChart').getContext('2d');
        if (this.progressChart) this.progressChart.destroy();

        this.progressChart = new Chart(ctx, {
          type: 'line',
          data: { datasets },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
              x: {
                type: 'time',
                time: { unit: 'day', displayFormats: { day: 'MMM dd' } },
                grid: { color: 'rgba(148,163,184,.08)' },
                ticks: { color: '#94a3b8' }
              },
              y: {
                min: 0,
                max: 100,
                grid: { color: 'rgba(148,163,184,.08)' },
                ticks: { color: '#94a3b8', stepSize: 20 }
              }
            },
            plugins: {
              legend: {
                display: levelFilter === 'all',
                labels: { color: '#e5e7eb' }
              }
            }
          }
        });
      }

      updateChartStats(levelFilter) {
        const t = this.text[this.currentLang];
        const source = levelFilter === 'all' 
          ? this.allExamResults 
          : this.allExamResults.filter(e => e.level === levelFilter);

        if (source.length === 0) {
          document.getElementById('chartStats').innerHTML = '';
          return;
        }

        const sorted = source.sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
        const scores = sorted.map(e => e.score);
        const count = scores.length;
        const best = Math.max(...scores);
        const avg = Math.round(scores.reduce((s, v) => s + v, 0) / count);
        const first = scores[0];
        const last = scores[count - 1];
        const diff = last - first;

        let trendClass = 'trend-flat';
        let trendText = `${diff}`;
        if (diff > 0) { 
          trendClass = 'trend-up'; 
          trendText = `+${diff}`; 
        } else if (diff < 0) { 
          trendClass = 'trend-down'; 
        }

        const cards = [
          { value: count, label: t.examCount },
          { value: best, label: t.bestScore },
          { value: avg, label: t.avgScore }
        ];

        if (count > 1) {
          cards.push({ value: trendText, label: t.trend, cls: trendClass });
        }

        document.getElementById('chartStats').innerHTML = cards.map(c => `
          <div class="chart-stat-card">
            <span class="chart-stat-value ${c.cls || ''}">${c.value}</span>
            <span class="chart-stat-label">${c.label}</span>
          </div>
        `).join('');
      }

      startExam(level) {
        window.location.href = `./exam.html?course=Python&level=${level}`;
      }

      viewLevelHistory(level) {
        const t = this.text[this.currentLang];
        const levels = this.levelConfig[this.currentLang];
        const filtered = this.allExamResults.filter(e => e.level === level);

        document.getElementById('historyTitle').innerHTML = `
          📊 ${levels[level].name}
          <button onclick="pythonSystem.showAllHistory()" style="margin-left:12px; padding:6px 14px; border-radius:8px; border:1px solid rgba(56,189,248,.3); background:rgba(56,189,248,.1); color:var(--accent); font-family:inherit; font-size:.85rem; cursor:pointer;">
            ${t.allLevels}
          </button>
        `;

        if (filtered.length === 0) {
          document.getElementById('historyContainer').innerHTML = `
            <div class="empty-state">
              <div class="empty-state-icon">📭</div>
              <h3>${t.noLevel}</h3>
            </div>
          `;
        } else {
          this.displayHistory(filtered);
        }
      }

      showAllHistory() {
        const t = this.text[this.currentLang];
        document.getElementById('historyTitle').textContent = t.examHistory;
        this.displayHistory(this.allExamResults);
      }

      goBack() {
        window.location.href = './profile.html';
      }
    }

    let pythonSystem;
    document.addEventListener('DOMContentLoaded', () => {
      pythonSystem = new PythonSystem();
      pythonSystem.init();
    });
  </script>
</body>
</html>
