<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>آزمون | Amirali Gholian</title>
  <link rel="icon" href="./logo.webp" type="image/png">
  <link rel="stylesheet" href="css/exam02.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <button class="back-btn" onclick="goBack()">← بازگشت</button>
      <div class="exam-title">
        <h1 id="courseTitle">بارگذاری...</h1>
      </div>
      <div style="width: 60px;"></div>
    </div>

    <!-- Exam Controls -->
    <div class="exam-controls">
      <div class="timer">
        <span class="timer-label">⏱️ زمان باقی</span>
        <span class="timer-value" id="timer">--:--</span>
      </div>
      <div style="flex: 1; display: flex; gap: 12px; align-items: center;">
        <div class="progress-bar">
          <div class="progress-fill" id="progressFill" style="width: 0%"></div>
        </div>
        <span class="progress-text" id="progressText">0 / 60</span>
      </div>
    </div>

    <!-- Question Container -->
    <div class="question-container" id="questionContainer">
      <div style="text-align: center; padding: 40px;">
        <div style="font-size: 3rem; margin-bottom: 20px;">⏳</div>
        <h2>در حال بارگذاری سوالات...</h2>
      </div>
    </div>

    <!-- Navigation -->
    <div class="navigation">
      <button class="nav-btn prev" id="prevBtn" onclick="previousQuestion()">← سوال قبلی</button>
      <button class="nav-btn next" id="nextBtn" onclick="nextQuestion()">سوال بعدی →</button>
    </div>

    <!-- Results -->
    <div class="results-container" id="resultsContainer">
      <div class="results-icon" id="resultIcon">✅</div>
      <h2 id="resultTitle">تبریک! آزمون تکمیل شد</h2>
      <div class="score-display" id="scoreDisplay">0/60</div>
      
      <div class="results-details">
        <div class="result-stat">
          <span class="result-stat-value" id="correctCount">0</span>
          <span class="result-stat-label">پاسخ صحیح</span>
        </div>
        <div class="result-stat">
          <span class="result-stat-value" id="incorrectCount">0</span>
          <span class="result-stat-label">پاسخ غلط</span>
        </div>
        <div class="result-stat">
          <span class="result-stat-value" id="scorePercent">0%</span>
          <span class="result-stat-label">نمره</span>
        </div>
      </div>

      <div class="results-actions">
        <button class="action-btn" onclick="retakeExam()">تکرار آزمون</button>
        <button class="action-btn primary" onclick="goToHome()">بازگشت به صفحه اصلی</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0"></script>
  <script src="./linux-questions.js"></script>
  <script>
    // ============ تنظیمات اساسی ============
    const SUPABASE = window.supabase.createClient(
      'https://cwwqmushilpxzpcpjute.supabase.co',
      'sb_publishable__AzVitbAoaYfEyvJMnIkkQ_AOkXCfbK'
    );

    let currentUser = null;
    let currentQuestion = 0;
    let questions = [];
    let answers = {};
    let timeRemaining = 5400; // 90 minutes in seconds
    let examActive = true;
    let examStartTime = Date.now();
    
    let courseParam = '';
    let levelParam = '';

    // Get URL parameters
    function getUrlParams() {
      const params = new URLSearchParams(window.location.search);
      courseParam = params.get('course') || 'Unknown';
      levelParam = params.get('level') || '';
      
      document.getElementById('courseTitle').textContent = `${courseParam} - آزمون ${levelParam}`;
    }

    // Initialize exam
    async function initExam() {
      try {
        // Check authentication
        const { data: { session } } = await SUPABASE.auth.getSession();
        if (!session) {
          window.location.href = './profile.html';
          return;
        }
        currentUser = session.user;

        // Get URL parameters
        getUrlParams();

        // Load questions
        if (!LINUX_QUESTIONS || !LINUX_QUESTIONS[levelParam]) {
          alert('سوالات برای این سطح موجود نیست!');
          goBack();
          return;
        }

        questions = LINUX_QUESTIONS[levelParam];
        
        if (questions.length === 0) {
          alert('سوالات یافت نشد!');
          goBack();
          return;
        }

        // Initialize answers object
        questions.forEach(q => {
          answers[q.id] = null;
        });

        // Start timer
        startTimer();

        // Display first question
        displayQuestion();

      } catch (err) {
        console.error('خطا در بارگذاری آزمون:', err);
        alert('خطایی رخ داد. لطفاً دوباره تلاش کنید.');
        goBack();
      }
    }

    // Display question
    function displayQuestion() {
      if (currentQuestion >= questions.length) {
        finishExam();
        return;
      }

      const q = questions[currentQuestion];
      const letters = ['الف', 'ب', 'پ', 'ت'];

      let optionsHtml = q.options.map((option, index) => {
        const isSelected = answers[q.id] === index;
        const selectedClass = isSelected ? 'selected' : '';
        const letter = letters[index] || String.fromCharCode(65 + index);
        
        return `
          <button class="option ${selectedClass}" onclick="selectOption(${index}, ${q.id})" data-option="${index}">
            <span class="option-letter">${letter}</span>
            <span>${option}</span>
          </button>
        `;
      }).join('');

      const html = `
        <div class="question-header">
          <div class="question-number">${currentQuestion + 1}</div>
          <div class="question-info">
            <h2>سوال ${currentQuestion + 1} از ${questions.length}</h2>
          </div>
        </div>
        <div class="question-text">${q.text}</div>
        <div class="options-grid">${optionsHtml}</div>
      `;

      document.getElementById('questionContainer').innerHTML = html;

      // Update progress
      updateProgress();

      // Update navigation buttons
      document.getElementById('prevBtn').disabled = currentQuestion === 0;
      document.getElementById('nextBtn').style.display = currentQuestion === questions.length - 1 ? 'none' : 'block';
      
      if (currentQuestion === questions.length - 1) {
        if (!document.getElementById('submitBtn')) {
          const submitBtn = document.createElement('button');
          submitBtn.id = 'submitBtn';
          submitBtn.className = 'nav-btn next submit';
          submitBtn.textContent = 'پایان آزمون ✓';
          submitBtn.onclick = finishExam;
          document.querySelector('.navigation').appendChild(submitBtn);
        }
      }
    }

    // Select option
    function selectOption(index, questionId) {
      answers[questionId] = index;
      displayQuestion();
    }

    // Navigation
    function previousQuestion() {
      if (currentQuestion > 0) {
        currentQuestion--;
        displayQuestion();
      }
    }

    function nextQuestion() {
      currentQuestion++;
      if (currentQuestion >= questions.length) {
        currentQuestion = questions.length - 1;
      }
      displayQuestion();
    }

    // Update progress
    function updateProgress() {
      const total = questions.length;
      const answered = Object.values(answers).filter(a => a !== null).length;
      const percentage = (answered / total) * 100;

      document.getElementById('progressFill').style.width = percentage + '%';
      document.getElementById('progressText').textContent = `${answered} / ${total}`;
    }

    // Timer
    function startTimer() {
      setInterval(() => {
        if (!examActive) return;

        timeRemaining--;
        const minutes = Math.floor(timeRemaining / 60);
        const seconds = timeRemaining % 60;

        document.getElementById('timer').textContent = 
          `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;

        if (timeRemaining <= 0) {
          finishExam();
        }
      }, 1000);
    }

    // Calculate score
    function calculateScore() {
      let correct = 0;
      questions.forEach(q => {
        if (answers[q.id] === q.correct) {
          correct++;
        }
      });
      return correct;
    }

    // Finish exam
    async function finishExam() {
      examActive = false;

      const totalQuestions = questions.length;
      const correctAnswers = calculateScore();
      const score = Math.round((correctAnswers / totalQuestions) * 100);

      const timeSpentSeconds = Math.round((Date.now() - examStartTime) / 1000);

      // Save results to Supabase
      try {
        const { data, error } = await SUPABASE
          .from('exam_results')
          .insert([{
          user_id: currentUser.id,
          email: currentUser.email,
          course: courseParam,
          level: levelParam,
          correct_answers: correctAnswers,
          wrong_answers: totalQuestions - correctAnswers,
          total_questions: totalQuestions,
          score: score,
          time_spent: timeSpentSeconds,
          created_at: new Date().toISOString()
      }]);
        console.log("DATA:", data);
        console.log("ERROR:", error);

        if (error) {
         throw error;
  }

  } catch (err) {
  console.error("خطا در ذخیره نتایج:", err);
  alert(err.message);
  }

      // Display results
      const percentage = score;
      const resultTitle = percentage >= 70 ? '✅ تبریک! آزمون تکمیل شد' : '❌ متأسفانه نتوانستید آزمون را پاس کنید';
      const resultIcon = percentage >= 70 ? '✅' : '❌';

      document.getElementById('resultIcon').textContent = resultIcon;
      document.getElementById('resultTitle').textContent = resultTitle;
      document.getElementById('scoreDisplay').textContent = `${correctAnswers}/${totalQuestions}`;
      document.getElementById('correctCount').textContent = correctAnswers;
      document.getElementById('incorrectCount').textContent = totalQuestions - correctAnswers;
      document.getElementById('scorePercent').textContent = percentage + '%';

      document.getElementById('questionContainer').style.display = 'none';
      document.getElementById('prevBtn').style.display = 'none';
      document.getElementById('nextBtn').style.display = 'none';
      const submitBtn = document.getElementById('submitBtn');
      if (submitBtn) submitBtn.style.display = 'none';

      document.getElementById('resultsContainer').classList.add('show');
    }

    // Retake exam
    function retakeExam() {
      window.location.reload();
    }

    // Go to home
    function goToHome() {
      window.location.href = './linux02.html';
    }

    // Go back
    function goBack() {
      window.location.href = './linux02.html';
    }

    // Start the exam
    initExam();
  </script>
</body>
</html>
