<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exam | Amirali Gholian (امیرعلی قولیان)</title>
  <link rel="icon" href="./logo.png" type="image/png">
  
  <meta name="theme-color" content="#050814">
  <link rel="manifest" href="/manifest.json">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0"></script>
  <script src="./linux-questions.js"></script>
  
  <style>
    :root {
      --bg0: #050814;
      --bg1: #070b16;
      --panel: rgba(15, 23, 42, .72);
      --line: rgba(148, 163, 184, .16);
      --text: #e5e7eb;
      --muted: #94a3b8;
      --soft: #cbd5e1;
      --accent: #38bdf8;
      --accent-2: #22c55e;
      --accent-3: #a78bfa;
      --radius: 26px;
      --max: 1180px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    
    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: 
        radial-gradient(circle at top left, rgba(56,189,248,.14), transparent 28%),
        radial-gradient(circle at top right, rgba(167,139,250,.12), transparent 24%),
        linear-gradient(180deg, var(--bg0), var(--bg1) 55%, #04060b 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ===== TOP BAR / NAVBAR ===== */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: var(--max);
      width: 100%;
      margin: 0 auto 20px;
      padding: 12px 20px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      backdrop-filter: blur(12px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, var(--accent), var(--accent-3));
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      box-shadow: 0 4px 16px rgba(56, 189, 248, .3);
      transition: transform .3s ease, box-shadow .3s ease;
    }

    .brand-icon:hover {
      transform: scale(1.08) rotate(-5deg);
      box-shadow: 0 6px 24px rgba(56, 189, 248, .45);
    }

    .brand-text h2 {
      margin: 0;
      font-size: 1.1rem;
      color: #fff;
      font-weight: 700;
      letter-spacing: .3px;
    }

    .brand-text span {
      font-size: .75rem;
      color: var(--muted);
    }

    /* Language Switcher */
    .lang-switcher {
      display: flex;
      gap: 6px;
      background: rgba(255, 255, 255, .04);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 4px;
    }

    .lang-btn {
      padding: 6px 14px;
      border-radius: 8px;
      border: none;
      background: transparent;
      color: var(--muted);
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      font-size: .85rem;
      transition: all .2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .lang-btn:hover {
      color: var(--text);
      background: rgba(255, 255, 255, .05);
    }

    .lang-btn.active {
      background: linear-gradient(135deg, var(--accent), rgba(56, 189, 248, .8));
      color: #fff;
      box-shadow: 0 4px 14px rgba(56, 189, 248, .25);
    }

    #examContainer {
      flex: 1;
      max-width: var(--max);
      margin: 0 auto;
      width: 100%;
      padding: 20px;
    }

    /* Header */
    .exam-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 32px;
      padding-bottom: 20px;
      border-bottom: 1px solid rgba(148, 163, 184, .16);
      flex-wrap: wrap;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 16px;
      flex: 1;
      min-width: 200px;
    }

    .back-button {
      padding: 10px 16px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, .15);
      background: rgba(255, 255, 255, .08);
      color: var(--text);
      cursor: pointer;
      font-family: inherit;
      font-size: .95rem;
      font-weight: 500;
      transition: all .25s ease;
      white-space: nowrap;
    }

    .back-button:hover {
      background: rgba(255, 255, 255, .12);
      border-color: rgba(255, 255, 255, .2);
    }

    .header-info {
      flex: 1;
      min-width: 150px;
    }

    .course-level {
      display: block;
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--soft);
      margin-bottom: 4px;
    }

    #questionNumber {
      display: block;
      font-size: .9rem;
      color: var(--muted);
    }

    #timer {
      padding: 12px 24px;
      background: rgba(56, 189, 248, .1);
      border: 2px solid rgba(56, 189, 248, .3);
      border-radius: 12px;
      color: var(--accent);
      font-weight: 700;
      font-size: 1.2rem;
      min-width: 120px;
      text-align: center;
      font-family: 'Monaco', monospace;
      transition: all .3s ease;
    }

    #timer.warning {
      background: rgba(248, 113, 113, .1);
      border-color: rgba(248, 113, 113, .3);
      color: #f87171;
    }

    /* Progress Bar */
    .progress-bar {
      height: 4px;
      background: rgba(255, 255, 255, .08);
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 32px;
    }

    #progressFill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      transition: width .3s ease;
    }

    /* Questions */
    #examContent {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 24px;
      margin-bottom: 40px;
    }

    .question-item {
      background: var(--panel);
      border: 1px solid rgba(56, 189, 248, .2);
      border-radius: 16px;
      padding: 28px;
      transition: all .3s ease;
      scroll-margin-top: 100px;
    }

    .question-item.answered {
      border-color: rgba(34, 197, 94, .4);
    }

    .question-item:hover {
      border-color: rgba(56, 189, 248, .4);
    }

    .question-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .question-header h3 {
      margin: 0;
      font-size: 1rem;
      font-weight: 600;
      color: var(--accent);
    }

    .question-status {
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      background: rgba(34, 197, 94, .2);
      border-radius: 50%;
      color: var(--accent-2);
      font-weight: 700;
    }

    .question-text {
      margin: 0 0 20px;
      font-size: 1.05rem;
      line-height: 1.6;
      color: #fff;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .option {
      padding: 16px 20px;
      background: rgba(255, 255, 255, .04);
      border: 2px solid rgba(255, 255, 255, .08);
      border-radius: 12px;
      color: var(--text);
      cursor: pointer;
      font-family: inherit;
      font-size: 1rem;
      transition: all .25s ease;
      display: flex;
      align-items: center;
      gap: 12px;
      text-align: right;
    }

    .option:hover {
      background: rgba(56, 189, 248, .1);
      border-color: rgba(56, 189, 248, .3);
    }

    .option.selected {
      background: rgba(34, 197, 94, .2);
      border-color: var(--accent-2);
      color: var(--accent-2);
    }

    .option-radio {
      width: 20px;
      height: 20px;
      border: 2px solid currentColor;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .option.selected .option-radio::after {
      content: '';
      width: 10px;
      height: 10px;
      background: currentColor;
      border-radius: 50%;
    }

    /* Footer */
    #examFooter {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .exam-nav {
      display: flex;
      align-items: center;
      gap: 16px;
      justify-content: center;
      flex: 1;
      min-width: 300px;
    }

    .nav-btn {
      padding: 12px 24px;
      background: rgba(56, 189, 248, .1);
      border: 1px solid rgba(56, 189, 248, .3);
      border-radius: 10px;
      color: var(--accent);
      cursor: pointer;
      font-family: inherit;
      font-weight: 600;
      transition: all .25s ease;
    }

    .nav-btn:hover {
      background: rgba(56, 189, 248, .2);
    }

    .exam-info {
      font-size: .95rem;
      color: var(--muted);
      padding: 8px 16px;
      background: rgba(255, 255, 255, .04);
      border-radius: 8px;
    }

    .submit-btn {
      padding: 14px 32px;
      background: linear-gradient(135deg, var(--accent), var(--accent-3));
      border: none;
      border-radius: 12px;
      color: #fff;
      font-family: inherit;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: all .3s ease;
      box-shadow: 0 8px 24px rgba(56, 189, 248, .3);
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 32px rgba(56, 189, 248, .4);
    }

    /* Modal */
    #resultModal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, .8);
      backdrop-filter: blur(12px);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    #resultModal.show {
      display: flex;
    }

    .modal-content {
      background: linear-gradient(135deg, var(--panel), rgba(15, 23, 42, .5));
      border: 1px solid rgba(56, 189, 248, .2);
      border-radius: 20px;
      padding: 40px;
      max-width: 600px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, .6);
    }

    .result-content {
      text-align: center;
    }

    .result-message {
      font-size: 1.3rem;
      font-weight: 600;
      color: var(--accent-2);
      margin-bottom: 12px;
    }

    .big-score {
      font-size: 4rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin: 20px 0;
    }

    .result-label {
      color: var(--muted);
      font-size: 1rem;
      margin-bottom: 32px;
    }

    .result-details {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 32px;
    }

    .detail-item {
      background: rgba(255, 255, 255, .04);
      border: 1px solid rgba(255, 255, 255, .08);
      border-radius: 12px;
      padding: 16px;
    }

    .detail-icon {
      display: block;
      font-size: 1.8rem;
      margin-bottom: 8px;
    }

    .detail-label {
      font-size: .85rem;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .detail-value {
      font-size: 1.2rem;
      font-weight: 700;
      color: #fff;
    }

    .result-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    .action-btn {
      padding: 12px 24px;
      border: none;
      border-radius: 10px;
      font-family: inherit;
      font-weight: 600;
      cursor: pointer;
      transition: all .25s ease;
    }

    .action-btn.primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-3));
      color: #fff;
      box-shadow: 0 8px 24px rgba(56, 189, 248, .3);
    }

    .action-btn.primary:hover {
      transform: translateY(-2px);
    }

    .action-btn.secondary {
      background: rgba(255, 255, 255, .08);
      border: 1px solid rgba(255, 255, 255, .15);
      color: var(--text);
    }

    .action-btn.secondary:hover {
      background: rgba(255, 255, 255, .12);
    }

    @media (max-width: 640px) {
      .exam-header {
        flex-direction: column;
        align-items: flex-start;
      }

      .result-details {
        grid-template-columns: 1fr;
      }

      .modal-content {
        padding: 24px;
      }

      .big-score {
        font-size: 3rem;
      }

      .question-text {
        font-size: 0.95rem;
      }
    }
  </style>
</head>
<body>
  <!-- Top Bar -->
  <div class="top-bar">
    <div class="brand">
      <div class="brand-icon">🐧</div>
      <div class="brand-text">
        <h2 id="brandTitle">Linux LPIC</h2>
        <span id="brandSubtitle">آماده‌سازی آزمون</span>
      </div>
    </div>
    <div class="lang-switcher">
      <button class="lang-btn active" id="btn-fa" onclick="examSystem?.switchLanguage('fa')">
        <span>🇮🇷</span> FA
      </button>
      <button class="lang-btn" id="btn-en" onclick="examSystem?.switchLanguage('en')">
        <span>🇺🇸</span> EN
      </button>
    </div>
  </div>

  <!-- Main Container -->
  <div id="examContainer">
    <!-- Header -->
    <div class="exam-header">
      <div class="header-left">
        <button class="back-button" id="backBtn" onclick="examSystem?.goBack()"><span id="backBtnText">← بازگشت</span></button>
        <div class="header-info">
          <span class="course-level" id="courseLevel">🔔 Linux (LPIC)</span>
          <span id="questionNumber">سوال 1 از 60</span>
        </div>
      </div>
      <div id="timer">90:00</div>
    </div>

    <!-- Progress Bar -->
    <div class="progress-bar">
      <div id="progressFill"></div>
    </div>

    <!-- Exam Content -->
    <div id="examContent"></div>

    <!-- Footer -->
    <div id="examFooter"></div>
  </div>

  <!-- Result Modal -->
  <div id="resultModal">
    <div class="modal-content">
      <div id="resultContent"></div>
    </div>
  </div>

  <script>
    class ExamSystem {
      constructor() {
        // ✅ Supabase تنظیمات (برگرفته از فایل Python)
        const SUPABASE_URL = 'https://cwwqmushilpxzpcpjute.supabase.co';
        const SUPABASE_KEY = 'sb_publishable__AzVitbAoaYfEyvJMnIkkQ_AOkXCfbK';
        
        try {
          this.SUPABASE = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        } catch (err) {
          console.warn('⚠️ Supabase خطا - نمرات ذخیره نخواهند شد:', err);
          this.SUPABASE = null;
        }

        this.currentUser = null;
        this.currentLang = 'fa';
        this.exam = {
          course: '',
          level: '',
          questions: [],
          answers: {},
          timeRemaining: 5400, // 90 دقیقه
          timerInterval: null,
          startTime: Date.now(),
          submitted: false
        };

        this.text = {
          fa: {
            brandTitle: 'Linux LPIC',
            brandSubtitle: 'آماده‌سازی آزمون',
            question: 'سوال',
            of: 'از',
            back: '← بازگشت',
            previous: '← قبلی',
            next: 'بعدی →',
            answeredInfo: 'پاسخ داده شده',
            submitBtn: 'ارسال آزمون',
            excellent: '🎉 عالی!',
            good: '✨ خوب!',
            average: '👍 متوسط',
            tryAgain: '💪 دوباره تلاش کنید',
            out100: 'از 100',
            correctAnswers: 'پاسخ صحیح',
            wrongAnswers: 'پاسخ غلط',
            timeSpent: 'زمان صرف شده',
            goBack: 'بازگشت',
            retake: 'تلاش مجدد',
            confirmBack: 'آیا مطمئن هستید؟ پاسخ‌های شما ذخیره نخواهند شد.'
          },
          en: {
            brandTitle: 'Linux LPIC',
            brandSubtitle: 'Exam Preparation',
            question: 'Question',
            of: 'of',
            back: '← Back',
            previous: '← Previous',
            next: 'Next →',
            answeredInfo: 'Answered',
            submitBtn: 'Submit Exam',
            excellent: '🎉 Excellent!',
            good: '✨ Good!',
            average: '👍 Average',
            tryAgain: '💪 Try Again',
            out100: 'out of 100',
            correctAnswers: 'Correct Answers',
            wrongAnswers: 'Wrong Answers',
            timeSpent: 'Time Spent',
            goBack: 'Go Back',
            retake: 'Retake Exam',
            confirmBack: 'Are you sure? Your answers will not be saved.'
          }
        };
      }

      async init() {
        const params = new URLSearchParams(window.location.search);
        this.exam.course = params.get('course') || 'Linux';
        this.exam.level = params.get('level') || '101';

        if (typeof LINUX_QUESTIONS !== 'undefined' && LINUX_QUESTIONS[this.exam.level]) {
          this.exam.questions = LINUX_QUESTIONS[this.exam.level];
        } else {
          console.error('❌ خطا: سوالات بارگیری نشدند.');
          alert('خطا: سوالات بارگیری نشدند!');
          return;
        }

        this.loadFromStorage();
        await this.checkAuth();
        this.render();
        this.startTimer();
      }

      async checkAuth() {
        try {
          const { data: { session } } = await this.SUPABASE.auth.getSession();
          if (session) {
            this.currentUser = session.user;
          } else {
            this.currentUser = { id: 'guest_' + Date.now(), email: 'guest@example.com' };
          }
        } catch (err) {
          console.warn('خطا در احراز هویت:', err);
          this.currentUser = { id: 'guest_' + Date.now(), email: 'guest@example.com' };
        }
      }

      switchLanguage(lang) {
        this.currentLang = lang;
        const t = this.text[lang];
        document.documentElement.lang = lang;
        document.documentElement.dir = lang === 'fa' ? 'rtl' : 'ltr';
        document.getElementById('btn-fa').classList.toggle('active', lang === 'fa');
        document.getElementById('btn-en').classList.toggle('active', lang === 'en');
        document.getElementById('brandTitle').textContent = t.brandTitle;
        document.getElementById('brandSubtitle').textContent = t.brandSubtitle;
        this.render();
      }

      render() {
        this.renderHeader();
        this.renderQuestions();
        this.renderFooter();
      }

      renderHeader() {
        const t = this.text[this.currentLang];
        const answered = Object.keys(this.exam.answers).length;
        const total = this.exam.questions.length;

        document.querySelector('.course-level').textContent = 
          `${this.exam.course} (${t.question} ${this.exam.level})`;
        document.getElementById('questionNumber').textContent = 
          `${t.question} ${answered} ${t.of} ${total}`;
        document.getElementById('backBtnText').textContent = t.back;
      }

      renderQuestions() {
        const t = this.text[this.currentLang];
        const html = this.exam.questions.map((q, idx) => {
          const questionText = typeof q.text === 'object' ? q.text[this.currentLang] : q.text;
          const options = typeof q.options === 'object' && Array.isArray(q.options[this.currentLang]) 
            ? q.options[this.currentLang] 
            : q.options;
          
          return `
            <div class="question-item ${this.exam.answers[idx] !== undefined ? 'answered' : ''}">
              <div class="question-header">
                <h3>${t.question} ${idx + 1}</h3>
                <span class="question-status">${this.exam.answers[idx] !== undefined ? '✓' : '○'}</span>
              </div>
              <p class="question-text">${questionText}</p>
              <div class="options">
                ${options.map((opt, optIdx) => `
                  <button class="option ${this.exam.answers[idx] === optIdx ? 'selected' : ''}"
                          onclick="examSystem.selectAnswer(${idx}, ${optIdx})">
                    <span class="option-radio"></span>
                    <span>${opt}</span>
                  </button>
                `).join('')}
              </div>
            </div>
          `;
        }).join('');

        document.getElementById('examContent').innerHTML = html;
        this.updateProgress();
      }

      renderFooter() {
        const t = this.text[this.currentLang];
        const answered = Object.keys(this.exam.answers).length;
        const total = this.exam.questions.length;
        
        const html = `
          <div class="exam-nav">
            <button class="nav-btn" onclick="examSystem.previousQuestion()">${t.previous}</button>
            <span class="exam-info">${answered}/${total} ${t.answeredInfo}</span>
            <button class="nav-btn" onclick="examSystem.nextQuestion()">${t.next}</button>
          </div>
          <button class="submit-btn" onclick="examSystem.submitExam()">${t.submitBtn}</button>
        `;

        document.getElementById('examFooter').innerHTML = html;
      }

      selectAnswer(questionIdx, optionIdx) {
        this.exam.answers[questionIdx] = optionIdx;
        this.render();
        this.saveToStorage();
      }

      updateProgress() {
        const answered = Object.keys(this.exam.answers).length;
        const progress = (answered / this.exam.questions.length) * 100;
        document.getElementById('progressFill').style.width = progress + '%';
      }

      previousQuestion() {
        const items = document.querySelectorAll('.question-item');
        for (let i = 0; i < items.length; i++) {
          if (items[i].getBoundingClientRect().top > 0) {
            if (i > 0) {
              items[i - 1].scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
            return;
          }
        }
      }

      nextQuestion() {
        const items = document.querySelectorAll('.question-item');
        for (let i = 0; i < items.length; i++) {
          if (items[i].getBoundingClientRect().top > 0) {
            if (i < items.length - 1) {
              items[i + 1].scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
            return;
          }
        }
      }

      startTimer() {
        this.updateTimer();
        this.exam.timerInterval = setInterval(() => {
          this.exam.timeRemaining--;
          this.updateTimer();

          if (this.exam.timeRemaining <= 0) {
            clearInterval(this.exam.timerInterval);
            this.submitExam();
          }
        }, 1000);
      }

      updateTimer() {
        const minutes = Math.floor(this.exam.timeRemaining / 60);
        const seconds = this.exam.timeRemaining % 60;
        
        const timerEl = document.getElementById('timer');
        timerEl.textContent = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        
        if (this.exam.timeRemaining <= 300) {
          timerEl.classList.add('warning');
        }
      }

      async submitExam() {
        if (this.exam.submitted) return;
        this.exam.submitted = true;
        clearInterval(this.exam.timerInterval);

        let correctCount = 0;
        Object.entries(this.exam.answers).forEach(([qIdx, answer]) => {
          if (this.exam.questions[parseInt(qIdx)].correct === answer) {
            correctCount++;
          }
        });

        const score = Math.round((correctCount / this.exam.questions.length) * 100);
        const timeSpent = Math.floor((Date.now() - this.exam.startTime) / 1000);

        await this.saveResult(score, correctCount, timeSpent);
        this.showResult(score, correctCount, timeSpent);
        this.clearStorage();
      }

      async saveResult(score, correctCount, timeSpent) {
        if (!this.SUPABASE || !this.currentUser) {
          console.warn('⚠️ نمرات در Supabase ذخیره نخواهند شد');
          return;
        }

        try {
          const { error } = await this.SUPABASE.from('exam_results').insert({
            user_id: this.currentUser.id,
            email: this.currentUser.email,
            course: this.exam.course,
            level: this.exam.level,
            score: score,
            correct_answers: correctCount,
            wrong_answers: this.exam.questions.length - correctCount,
            time_spent: timeSpent,
            created_at: new Date().toISOString()
          });

          if (error) {
            console.error('❌ Supabase خطا:', error);
            return;
          }

          console.log('✅ نمره ذخیره شد');
        } catch (err) {
          console.error('❌ خطا:', err);
        }
      }

      showResult(score, correctCount, timeSpent) {
        const t = this.text[this.currentLang];
        const minutes = Math.floor(timeSpent / 60);
        const seconds = timeSpent % 60;

        let message = '';
        if (score >= 90) message = t.excellent;
        else if (score >= 75) message = t.good;
        else if (score >= 50) message = t.average;
        else message = t.tryAgain;

        const resultHTML = `
          <div class="result-content">
            <div class="result-message">${message}</div>
            <div class="big-score">${score}</div>
            <div class="result-label">${t.out100}</div>

            <div class="result-details">
              <div class="detail-item">
                <span class="detail-icon">✓</span>
                <div class="detail-label">${t.correctAnswers}</div>
                <div class="detail-value">${correctCount}</div>
              </div>

              <div class="detail-item">
                <span class="detail-icon">✗</span>
                <div class="detail-label">${t.wrongAnswers}</div>
                <div class="detail-value">${this.exam.questions.length - correctCount}</div>
              </div>

              <div class="detail-item">
                <span class="detail-icon">⏱</span>
                <div class="detail-label">${t.timeSpent}</div>
                <div class="detail-value">${minutes}:${String(seconds).padStart(2, '0')}</div>
              </div>
            </div>

            <div class="result-actions">
              <button class="action-btn primary" onclick="examSystem.goHome()">${t.goBack}</button>
              <button class="action-btn secondary" onclick="examSystem.retakeExam()">${t.retake}</button>
            </div>
          </div>
        `;

        document.getElementById('resultContent').innerHTML = resultHTML;
        document.getElementById('resultModal').classList.add('show');
      }

      goBack() {
        if (Object.keys(this.exam.answers).length > 0) {
          const confirmText = this.text[this.currentLang].confirmBack;
          if (!confirm(confirmText)) {
            return;
          }
        }
        this.goHome();
      }

      goHome() {
        window.location.href = './linux02.html';
      }

      retakeExam() {
        window.location.href = `./exam02.html?course=${this.exam.course}&level=${this.exam.level}`;
      }

      saveToStorage() {
        const key = `exam_${this.exam.course}_${this.exam.level}`;
        const data = {
          answers: this.exam.answers,
          timeRemaining: this.exam.timeRemaining,
          startTime: this.exam.startTime
        };
        localStorage.setItem(key, JSON.stringify(data));
      }

      loadFromStorage() {
        const key = `exam_${this.exam.course}_${this.exam.level}`;
        const stored = localStorage.getItem(key);
        
        if (stored) {
          try {
            const data = JSON.parse(stored);
            this.exam.answers = data.answers || {};
            
            const elapsed = Math.floor((Date.now() - data.startTime) / 1000);
            this.exam.timeRemaining = Math.max(0, data.timeRemaining - elapsed);
          } catch (err) {
            console.error('❌ خطا:', err);
          }
        }
      }

      clearStorage() {
        const key = `exam_${this.exam.course}_${this.exam.level}`;
        localStorage.removeItem(key);
      }
    }

    let examSystem;
    document.addEventListener('DOMContentLoaded', () => {
      examSystem = new ExamSystem();
      examSystem.init();
    });
  </script>
</body>
</html>
