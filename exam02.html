<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>آزمون | Amirali Gholian</title>
  <link rel="icon" href="./logo.webp" type="image/png">

  <style>
    :root {
      --bg0: #050814;
      --bg1: #070b16;
      --panel: rgba(15, 23, 42, .72);
      --line: rgba(148, 163, 184, .16);
      --text: #e5e7eb;
      --muted: #94a3b8;
      --soft: #cbd5e1;
      --accent: #38bdf8;
      --accent-2: #22c55e;
      --accent-3: #a78bfa;
      --shadow: 0 20px 60px rgba(0, 0, 0, .42);
      --radius: 26px;
      --max: 1180px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top left, rgba(56,189,248,.14), transparent 28%),
        radial-gradient(circle at top right, rgba(167,139,250,.12), transparent 24%),
        linear-gradient(180deg, var(--bg0), var(--bg1) 55%, #04060b 100%);
      color: var(--text);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: var(--max);
      margin: 0 auto;
    }

    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
      gap: 20px;
    }

    .back-btn {
      padding: 10px 16px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, .15);
      background: rgba(255, 255, 255, .08);
      color: var(--text);
      cursor: pointer;
      font-family: inherit;
      font-size: .95rem;
      font-weight: 500;
      transition: all .25s ease;
    }

    .back-btn:hover {
      background: rgba(255, 255, 255, .12);
      border-color: rgba(255, 255, 255, .2);
    }

    .exam-title {
      flex: 1;
      text-align: center;
    }

    .exam-title h1 {
      margin: 0;
      font-size: 1.8rem;
      background: linear-gradient(135deg, #fff, var(--soft));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* Timer & Progress */
    .exam-controls {
      display: flex;
      gap: 20px;
      margin-bottom: 32px;
      align-items: center;
      flex-wrap: wrap;
    }

    .timer {
      background: rgba(56, 189, 248, .1);
      border: 1px solid rgba(56, 189, 248, .3);
      border-radius: 12px;
      padding: 12px 20px;
      text-align: center;
      min-width: 120px;
    }

    .timer-label {
      display: block;
      font-size: .85rem;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .timer-value {
      display: block;
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--accent);
      font-family: 'Courier New', monospace;
    }

    .progress-bar {
      flex: 1;
      background: rgba(255, 255, 255, .05);
      border-radius: 8px;
      height: 8px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, .1);
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      transition: width .3s ease;
    }

    .progress-text {
      font-size: .85rem;
      color: var(--muted);
      white-space: nowrap;
      min-width: 80px;
    }

    /* Question Container */
    .question-container {
      background: var(--panel);
      border: 1px solid rgba(56, 189, 248, .2);
      border-radius: var(--radius);
      padding: 40px;
      margin-bottom: 32px;
    }

    .question-header {
      display: flex;
      gap: 16px;
      align-items: center;
      margin-bottom: 24px;
    }

    .question-number {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), rgba(56, 189, 248, .8));
      font-weight: 700;
      font-size: 1.1rem;
      flex-shrink: 0;
    }

    .question-info h2 {
      margin: 0;
      font-size: 1.2rem;
      color: #fff;
    }

    .question-difficulty {
      display: inline-block;
      font-size: .8rem;
      color: var(--muted);
      margin-top: 4px;
    }

    .question-text {
      font-size: 1.1rem;
      line-height: 1.8;
      color: #fff;
      margin-bottom: 32px;
    }

    /* Options */
    .options-grid {
      display: grid;
      gap: 16px;
    }

    .option {
      padding: 18px 24px;
      border: 2px solid rgba(56, 189, 248, .2);
      border-radius: 12px;
      background: rgba(255, 255, 255, .02);
      cursor: pointer;
      transition: all .25s ease;
      font-size: 1rem;
      line-height: 1.6;
      color: var(--text);
      text-align: right;
      display: flex;
      gap: 16px;
      align-items: flex-start;
    }

    .option:hover {
      background: rgba(56, 189, 248, .08);
      border-color: rgba(56, 189, 248, .4);
      transform: translateX(-4px);
    }

    .option.selected {
      background: rgba(56, 189, 248, .15);
      border-color: var(--accent);
      box-shadow: 0 0 20px rgba(56, 189, 248, .2);
    }

    .option.correct {
      background: rgba(34, 197, 94, .15);
      border-color: var(--accent-2);
      box-shadow: 0 0 20px rgba(34, 197, 94, .2);
    }

    .option.incorrect {
      background: rgba(239, 68, 68, .15);
      border-color: #ef4444;
      box-shadow: 0 0 20px rgba(239, 68, 68, .2);
    }

    .option-letter {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: rgba(56, 189, 248, .2);
      font-weight: 600;
      color: var(--accent);
      flex-shrink: 0;
    }

    .option.selected .option-letter {
      background: var(--accent);
      color: #fff;
    }

    /* Navigation */
    .navigation {
      display: flex;
      gap: 16px;
      justify-content: space-between;
      margin-bottom: 32px;
      flex-wrap: wrap;
    }

    .nav-btn {
      padding: 14px 32px;
      border-radius: 12px;
      border: none;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all .25s ease;
    }

    .nav-btn.prev {
      border: 1px solid rgba(56, 189, 248, .3);
      background: rgba(56, 189, 248, .1);
      color: var(--accent);
    }

    .nav-btn.prev:hover:not(:disabled) {
      background: rgba(56, 189, 248, .15);
      border-color: rgba(56, 189, 248, .5);
    }

    .nav-btn.next {
      background: linear-gradient(135deg, var(--accent), rgba(56, 189, 248, .8));
      color: #fff;
      margin-left: auto;
    }

    .nav-btn.next:hover:not(:disabled) {
      box-shadow: 0 12px 30px rgba(56, 189, 248, .25);
      transform: translateY(-2px);
    }

    .nav-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .nav-btn.submit {
      background: linear-gradient(135deg, var(--accent-2), rgba(34, 197, 94, .8));
    }

    .nav-btn.submit:hover:not(:disabled) {
      box-shadow: 0 12px 30px rgba(34, 197, 94, .25);
      transform: translateY(-2px);
    }

    /* Results */
    .results-container {
      display: none;
      text-align: center;
      background: var(--panel);
      border: 1px solid rgba(56, 189, 248, .2);
      border-radius: var(--radius);
      padding: 60px 40px;
    }

    .results-container.show {
      display: block;
    }

    .results-icon {
      font-size: 4rem;
      margin-bottom: 20px;
    }

    .results-container h2 {
      font-size: 2rem;
      margin: 0 0 16px;
      color: #fff;
    }

    .score-display {
      font-size: 3.5rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin: 24px 0;
    }

    .results-details {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin: 32px 0;
    }

    .result-stat {
      background: rgba(255, 255, 255, .04);
      border-radius: 12px;
      padding: 20px;
    }

    .result-stat-value {
      display: block;
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 8px;
    }

    .result-stat-label {
      display: block;
      font-size: .9rem;
      color: var(--muted);
    }

    .results-actions {
      display: flex;
      gap: 16px;
      justify-content: center;
      margin-top: 32px;
      flex-wrap: wrap;
    }

    .action-btn {
      padding: 12px 28px;
      border-radius: 10px;
      border: 1px solid rgba(56, 189, 248, .3);
      background: rgba(56, 189, 248, .1);
      color: var(--accent);
      cursor: pointer;
      font-family: inherit;
      font-size: .95rem;
      font-weight: 600;
      transition: all .25s ease;
    }

    .action-btn:hover {
      background: rgba(56, 189, 248, .15);
      border-color: rgba(56, 189, 248, .5);
      transform: translateY(-2px);
    }

    .action-btn.primary {
      background: linear-gradient(135deg, var(--accent), rgba(56, 189, 248, .8));
      color: #fff;
      border: none;
    }

    .action-btn.primary:hover {
      box-shadow: 0 12px 30px rgba(56, 189, 248, .25);
    }

    @media (max-width: 768px) {
      .question-container {
        padding: 24px;
      }

      .header {
        flex-direction: column;
        gap: 12px;
      }

      .exam-controls {
        flex-direction: column;
      }

      .progress-bar {
        order: -1;
        min-width: 100%;
      }

      .results-container {
        padding: 40px 24px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <button class="back-btn" onclick="goBack()">← بازگشت</button>
      <div class="exam-title">
        <h1 id="courseTitle">بارگذاری...</h1>
      </div>
      <div style="width: 60px;"></div>
    </div>

    <!-- Exam Controls -->
    <div class="exam-controls">
      <div class="timer">
        <span class="timer-label">⏱️ زمان باقی</span>
        <span class="timer-value" id="timer">--:--</span>
      </div>
      <div style="flex: 1; display: flex; gap: 12px; align-items: center;">
        <div class="progress-bar">
          <div class="progress-fill" id="progressFill" style="width: 0%"></div>
        </div>
        <span class="progress-text" id="progressText">0 / 60</span>
      </div>
    </div>

    <!-- Question Container -->
    <div class="question-container" id="questionContainer">
      <div style="text-align: center; padding: 40px;">
        <div style="font-size: 3rem; margin-bottom: 20px;">⏳</div>
        <h2>در حال بارگذاری سوالات...</h2>
      </div>
    </div>

    <!-- Navigation -->
    <div class="navigation">
      <button class="nav-btn prev" id="prevBtn" onclick="previousQuestion()">← سوال قبلی</button>
      <button class="nav-btn next" id="nextBtn" onclick="nextQuestion()">سوال بعدی →</button>
    </div>

    <!-- Results -->
    <div class="results-container" id="resultsContainer">
      <div class="results-icon" id="resultIcon">✅</div>
      <h2 id="resultTitle">تبریک! آزمون تکمیل شد</h2>
      <div class="score-display" id="scoreDisplay">0/60</div>
      
      <div class="results-details">
        <div class="result-stat">
          <span class="result-stat-value" id="correctCount">0</span>
          <span class="result-stat-label">پاسخ صحیح</span>
        </div>
        <div class="result-stat">
          <span class="result-stat-value" id="incorrectCount">0</span>
          <span class="result-stat-label">پاسخ غلط</span>
        </div>
        <div class="result-stat">
          <span class="result-stat-value" id="scorePercent">0%</span>
          <span class="result-stat-label">نمره</span>
        </div>
      </div>

      <div class="results-actions">
        <button class="action-btn" onclick="retakeExam()">تکرار آزمون</button>
        <button class="action-btn primary" onclick="goToHome()">بازگشت به صفحه اصلی</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0"></script>
  <script src="./linux-questions.js"></script>
  <script>
    // ============ تنظیمات اساسی ============
    const SUPABASE = window.supabase.createClient(
      'https://cwwqmushilpxzpcpjute.supabase.co',
      'sb_publishable__AzVitbAoaYfEyvJMnIkkQ_AOkXCfbK'
    );

    let currentUser = null;
    let currentQuestion = 0;
    let questions = [];
    let answers = {};
    let timeRemaining = 5400; // 90 minutes in seconds
    let examActive = true;
    let examStartTime = Date.now();
    
    let courseParam = '';
    let levelParam = '';

    // Get URL parameters
    function getUrlParams() {
      const params = new URLSearchParams(window.location.search);
      courseParam = params.get('course') || 'Unknown';
      levelParam = params.get('level') || '';
      
      document.getElementById('courseTitle').textContent = `${courseParam} - آزمون ${levelParam}`;
    }

    // Initialize exam
    async function initExam() {
      try {
        // Check authentication
        const { data: { session } } = await SUPABASE.auth.getSession();
        if (!session) {
          window.location.href = './profile.html';
          return;
        }
        currentUser = session.user;

        // Get URL parameters
        getUrlParams();

        // Load questions
        if (!LINUX_QUESTIONS || !LINUX_QUESTIONS[levelParam]) {
          alert('سوالات برای این سطح موجود نیست!');
          goBack();
          return;
        }

        questions = LINUX_QUESTIONS[levelParam];
        
        if (questions.length === 0) {
          alert('سوالات یافت نشد!');
          goBack();
          return;
        }

        // Initialize answers object
        questions.forEach(q => {
          answers[q.id] = null;
        });

        // Start timer
        startTimer();

        // Display first question
        displayQuestion();

      } catch (err) {
        console.error('خطا در بارگذاری آزمون:', err);
        alert('خطایی رخ داد. لطفاً دوباره تلاش کنید.');
        goBack();
      }
    }

    // Display question
    function displayQuestion() {
      if (currentQuestion >= questions.length) {
        finishExam();
        return;
      }

      const q = questions[currentQuestion];
      const letters = ['الف', 'ب', 'پ', 'ت'];

      let optionsHtml = q.options.map((option, index) => {
        const isSelected = answers[q.id] === index;
        const selectedClass = isSelected ? 'selected' : '';
        const letter = letters[index] || String.fromCharCode(65 + index);
        
        return `
          <button class="option ${selectedClass}" onclick="selectOption(${index}, ${q.id})" data-option="${index}">
            <span class="option-letter">${letter}</span>
            <span>${option}</span>
          </button>
        `;
      }).join('');

      const html = `
        <div class="question-header">
          <div class="question-number">${currentQuestion + 1}</div>
          <div class="question-info">
            <h2>سوال ${currentQuestion + 1} از ${questions.length}</h2>
          </div>
        </div>
        <div class="question-text">${q.text}</div>
        <div class="options-grid">${optionsHtml}</div>
      `;

      document.getElementById('questionContainer').innerHTML = html;

      // Update progress
      updateProgress();

      // Update navigation buttons
      document.getElementById('prevBtn').disabled = currentQuestion === 0;
      document.getElementById('nextBtn').style.display = currentQuestion === questions.length - 1 ? 'none' : 'block';
      
      if (currentQuestion === questions.length - 1) {
        if (!document.getElementById('submitBtn')) {
          const submitBtn = document.createElement('button');
          submitBtn.id = 'submitBtn';
          submitBtn.className = 'nav-btn next submit';
          submitBtn.textContent = 'پایان آزمون ✓';
          submitBtn.onclick = finishExam;
          document.querySelector('.navigation').appendChild(submitBtn);
        }
      }
    }

    // Select option
    function selectOption(index, questionId) {
      answers[questionId] = index;
      displayQuestion();
    }

    // Navigation
    function previousQuestion() {
      if (currentQuestion > 0) {
        currentQuestion--;
        displayQuestion();
      }
    }

    function nextQuestion() {
      currentQuestion++;
      if (currentQuestion >= questions.length) {
        currentQuestion = questions.length - 1;
      }
      displayQuestion();
    }

    // Update progress
    function updateProgress() {
      const total = questions.length;
      const answered = Object.values(answers).filter(a => a !== null).length;
      const percentage = (answered / total) * 100;

      document.getElementById('progressFill').style.width = percentage + '%';
      document.getElementById('progressText').textContent = `${answered} / ${total}`;
    }

    // Timer
    function startTimer() {
      setInterval(() => {
        if (!examActive) return;

        timeRemaining--;
        const minutes = Math.floor(timeRemaining / 60);
        const seconds = timeRemaining % 60;

        document.getElementById('timer').textContent = 
          `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;

        if (timeRemaining <= 0) {
          finishExam();
        }
      }, 1000);
    }

    // Calculate score
    function calculateScore() {
      let correct = 0;
      questions.forEach(q => {
        if (answers[q.id] === q.correct) {
          correct++;
        }
      });
      return correct;
    }

    // Finish exam
    async function finishExam() {
      examActive = false;

      const totalQuestions = questions.length;
      const correctAnswers = calculateScore();
      const score = Math.round((correctAnswers / totalQuestions) * 100);

      const timeSpentSeconds = Math.round((Date.now() - examStartTime) / 1000);

      // Save results to Supabase
      try {
        const { data, error } = await SUPABASE
          .from('exam_results')
          .insert([{
          user_id: currentUser.id,
          email: currentUser.email,
          course: courseParam,
          level: levelParam,
          correct_answers: correctAnswers,
          wrong_answers: totalQuestions - correctAnswers,
          total_questions: totalQuestions,
          score: score,
          time_spent: timeSpentSeconds,
          created_at: new Date().toISOString()
      }]);
        console.log("DATA:", data);
        console.log("ERROR:", error);

        if (error) {
         throw error;
  }

  } catch (err) {
  console.error("خطا در ذخیره نتایج:", err);
  alert(err.message);
  }

      // Display results
      const percentage = score;
      const resultTitle = percentage >= 70 ? '✅ تبریک! آزمون تکمیل شد' : '❌ متأسفانه نتوانستید آزمون را پاس کنید';
      const resultIcon = percentage >= 70 ? '✅' : '❌';

      document.getElementById('resultIcon').textContent = resultIcon;
      document.getElementById('resultTitle').textContent = resultTitle;
      document.getElementById('scoreDisplay').textContent = `${correctAnswers}/${totalQuestions}`;
      document.getElementById('correctCount').textContent = correctAnswers;
      document.getElementById('incorrectCount').textContent = totalQuestions - correctAnswers;
      document.getElementById('scorePercent').textContent = percentage + '%';

      document.getElementById('questionContainer').style.display = 'none';
      document.getElementById('prevBtn').style.display = 'none';
      document.getElementById('nextBtn').style.display = 'none';
      const submitBtn = document.getElementById('submitBtn');
      if (submitBtn) submitBtn.style.display = 'none';

      document.getElementById('resultsContainer').classList.add('show');
    }

    // Retake exam
    function retakeExam() {
      window.location.reload();
    }

    // Go to home
    function goToHome() {
      window.location.href = './linux02.html';
    }

    // Go back
    function goBack() {
      window.location.href = './linux02.html';
    }

    // Start the exam
    initExam();
  </script>
</body>
</html>
