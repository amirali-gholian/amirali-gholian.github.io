<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>امتحان Python | Amirali Gholian (امیرعلی قولیان)</title>
  <link rel="icon" href="./logo.webp" type="image/webp">
  
  <meta name="theme-color" content="#050814">
  <link rel="manifest" href="/manifest.json">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0"></script>
  <script async src="https://cdn.jsdelivr.net/pyodide/v0.24.1/full/pyodide.js"></script>
  
  <style>
    :root {
      --bg0: #050814;
      --bg1: #070b16;
      --panel: rgba(15, 23, 42, .72);
      --line: rgba(148, 163, 184, .16);
      --text: #e5e7eb;
      --muted: #94a3b8;
      --soft: #cbd5e1;
      --accent: #38bdf8;
      --accent-2: #22c55e;
      --accent-3: #a78bfa;
      --radius: 26px;
      --max: 1180px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    
    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: 
        radial-gradient(circle at top left, rgba(56,189,248,.14), transparent 28%),
        radial-gradient(circle at top right, rgba(167,139,250,.12), transparent 24%),
        linear-gradient(180deg, var(--bg0), var(--bg1) 55%, #04060b 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    #examContainer {
      flex: 1;
      max-width: var(--max);
      margin: 0 auto;
      width: 100%;
      padding: 20px;
    }

    /* ===== TOP BAR / NAVBAR ===== */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding: 12px 20px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      backdrop-filter: blur(12px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, var(--accent), var(--accent-3));
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      box-shadow: 0 4px 16px rgba(56, 189, 248, .3);
      transition: transform .3s ease, box-shadow .3s ease;
    }

    .brand-icon:hover {
      transform: scale(1.08) rotate(-5deg);
      box-shadow: 0 6px 24px rgba(56, 189, 248, .45);
    }

    .brand-text h2 {
      margin: 0;
      font-size: 1.1rem;
      color: #fff;
      font-weight: 700;
      letter-spacing: .3px;
    }

    .brand-text span {
      font-size: .75rem;
      color: var(--muted);
    }

    /* Language Switcher */
    .lang-switcher {
      display: flex;
      gap: 6px;
      background: rgba(255, 255, 255, .04);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 4px;
    }

    .lang-btn {
      padding: 6px 14px;
      border-radius: 8px;
      border: none;
      background: transparent;
      color: var(--muted);
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      font-size: .85rem;
      transition: all .2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .lang-btn:hover {
      color: var(--text);
      background: rgba(255, 255, 255, .05);
    }

    .lang-btn.active {
      background: linear-gradient(135deg, var(--accent), rgba(56, 189, 248, .8));
      color: #fff;
      box-shadow: 0 4px 14px rgba(56, 189, 248, .25);
    }

    /* Header */
    .exam-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 32px;
      padding-bottom: 20px;
      border-bottom: 1px solid rgba(148, 163, 184, .16);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 16px;
      flex: 1;
    }

    .back-button {
      padding: 10px 16px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, .15);
      background: rgba(255, 255, 255, .08);
      color: var(--text);
      cursor: pointer;
      font-family: inherit;
      font-size: .95rem;
      font-weight: 500;
      transition: all .25s ease;
      white-space: nowrap;
    }

    .back-button:hover {
      background: rgba(255, 255, 255, .12);
      border-color: rgba(255, 255, 255, .2);
    }

    .header-info {
      flex: 1;
    }

    .course-level {
      display: block;
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--soft);
      margin-bottom: 4px;
    }

    #questionNumber {
      display: block;
      font-size: .9rem;
      color: var(--muted);
    }

    #timer {
      padding: 12px 24px;
      background: rgba(56, 189, 248, .1);
      border: 2px solid rgba(56, 189, 248, .3);
      border-radius: 12px;
      color: var(--accent);
      font-weight: 700;
      font-size: 1.2rem;
      min-width: 120px;
      text-align: center;
      font-family: 'Monaco', monospace;
      transition: all .3s ease;
    }

    #timer.warning {
      background: rgba(248, 113, 113, .1);
      border-color: rgba(248, 113, 113, .3);
      color: #f87171;
    }

    /* Progress Bar */
    .progress-bar {
      height: 4px;
      background: rgba(255, 255, 255, .08);
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 32px;
    }

    #progressFill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      transition: width .3s ease;
    }

    /* Questions */
    #examContent {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 24px;
      margin-bottom: 40px;
    }

    .question-item {
      background: var(--panel);
      border: 1px solid rgba(56, 189, 248, .2);
      border-radius: 16px;
      padding: 28px;
      transition: all .3s ease;
      scroll-margin-top: 100px;
    }

    .question-item.answered {
      border-color: rgba(34, 197, 94, .4);
    }

    .question-item:hover {
      border-color: rgba(56, 189, 248, .4);
    }

    .question-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .question-header h3 {
      margin: 0;
      font-size: 1rem;
      font-weight: 600;
      color: var(--accent);
    }

    .question-status {
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      background: rgba(34, 197, 94, .2);
      border-radius: 50%;
      color: var(--accent-2);
      font-weight: 700;
    }

    .question-text {
      margin: 0 0 20px;
      font-size: 1.05rem;
      line-height: 1.6;
      color: #fff;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .question-text .question-line {
      display: block;
    }

    .question-text .code-block {
      display: block;
      margin-top: 12px;
      padding: 12px 14px;
      background: #0f1419;
      border: 1px solid rgba(56, 189, 248, .2);
      border-radius: 8px;
      color: #e8f05a;
      font-family: 'Monaco', 'Consolas', monospace;
      font-size: .9rem;
      line-height: 1.6;
      direction: ltr;
      text-align: left;
      unicode-bidi: plaintext;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .option {
      padding: 16px 20px;
      background: rgba(255, 255, 255, .04);
      border: 2px solid rgba(255, 255, 255, .08);
      border-radius: 12px;
      color: var(--text);
      cursor: pointer;
      font-family: inherit;
      font-size: 1rem;
      transition: all .25s ease;
      display: flex;
      align-items: center;
      gap: 12px;
      text-align: right;
    }

    .option:hover {
      background: rgba(56, 189, 248, .1);
      border-color: rgba(56, 189, 248, .3);
    }

    .option.selected {
      background: rgba(56, 189, 248, .15);
      border-color: rgba(56, 189, 248, .5);
      color: #fff;
    }

    .option-radio {
      width: 20px;
      height: 20px;
      border: 2px solid rgba(255, 255, 255, .3);
      border-radius: 50%;
      flex-shrink: 0;
      transition: all .25s ease;
    }

    .option.selected .option-radio {
      background: var(--accent);
      border-color: var(--accent);
      box-shadow: 0 0 8px rgba(56, 189, 248, .5);
    }

    /* Footer */
    #examFooter {
      padding-top: 20px;
      border-top: 1px solid rgba(148, 163, 184, .16);
    }

    .exam-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .nav-btn {
      padding: 10px 20px;
      border-radius: 10px;
      border: 1px solid rgba(56, 189, 248, .3);
      background: rgba(56, 189, 248, .05);
      color: var(--accent);
      cursor: pointer;
      font-family: inherit;
      font-weight: 500;
      transition: all .25s ease;
    }

    .nav-btn:hover {
      background: rgba(56, 189, 248, .15);
      border-color: rgba(56, 189, 248, .5);
    }

    .exam-info {
      color: var(--muted);
      font-size: .9rem;
    }

    .submit-btn {
      width: 100%;
      padding: 16px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, var(--accent-2), rgba(34, 197, 94, .8));
      color: #fff;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: all .3s ease;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(34, 197, 94, .25);
    }

    /* Modal */
    .result-modal {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, .7);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: all .3s ease;
    }

    .result-modal.show {
      opacity: 1;
      visibility: visible;
    }

    #resultContent {
      background: var(--panel);
      border: 1px solid rgba(56, 189, 248, .2);
      border-radius: var(--radius);
      padding: 40px;
      max-width: 500px;
      width: 100%;
      animation: slideUp .4s ease;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .result-content {
      display: flex;
      flex-direction: column;
      gap: 32px;
      text-align: center;
    }

    .result-message {
      font-size: 1.2rem;
      color: #fff;
      font-weight: 600;
      margin-bottom: 16px;
    }

    .big-score {
      font-size: 4rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
    }

    .result-label {
      color: var(--muted);
      font-size: .95rem;
    }

    .result-details {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    .detail-item {
      background: rgba(255, 255, 255, .04);
      border: 1px solid rgba(255, 255, 255, .08);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .detail-icon {
      font-size: 1.8rem;
    }

    .detail-label {
      font-size: .85rem;
      color: var(--muted);
    }

    .detail-value {
      font-size: 1.6rem;
      font-weight: 700;
      color: #fff;
    }

    .result-actions {
      display: flex;
      gap: 12px;
    }

    .action-btn {
      flex: 1;
      padding: 14px;
      border-radius: 10px;
      border: none;
      font-weight: 600;
      font-size: .95rem;
      cursor: pointer;
      font-family: inherit;
      transition: all .25s ease;
    }

    .action-btn.primary {
      background: linear-gradient(135deg, var(--accent), rgba(56, 189, 248, .8));
      color: #fff;
    }

    .action-btn.primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(56, 189, 248, .25);
    }

    .action-btn.secondary {
      background: rgba(255, 255, 255, .08);
      color: var(--text);
      border: 1px solid rgba(255, 255, 255, .15);
    }

    .action-btn.secondary:hover {
      background: rgba(255, 255, 255, .12);
    }

    @media (max-width: 768px) {
      #examContainer {
        padding: 12px;
      }

      .exam-header {
        flex-direction: column;
        align-items: flex-start;
      }

      .question-item {
        padding: 20px;
      }

      .result-details {
        grid-template-columns: 1fr;
      }

      .big-score {
        font-size: 3rem;
      }

      #resultContent {
        padding: 24px;
      }

      .top-bar {
        flex-direction: column;
        gap: 12px;
      }
    }

    /* IDE Styles */
    .question-ide {
      background: rgba(0, 0, 0, .3);
      border: 1px solid rgba(56, 189, 248, .15);
      border-radius: 12px;
      padding: 16px;
      margin: 20px 0;
    }

    .ide-label {
      font-weight: 600;
      color: var(--accent);
      font-size: .9rem;
      margin-bottom: 12px;
    }

    .ide-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 12px;
    }

    @media (max-width: 768px) {
      .ide-grid {
        grid-template-columns: 1fr;
      }
    }

    .code-input {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .input-label {
      font-size: .85rem;
      color: var(--muted);
      font-weight: 500;
    }

    .code-textarea {
      width: 100%;
      padding: 12px;
      background: #0f1419;
      border: 1px solid rgba(56, 189, 248, .2);
      border-radius: 8px;
      color: #e8f05a;
      font-family: 'Monaco', 'Consolas', monospace;
      font-size: 13px;
      min-height: 120px;
      resize: vertical;
      line-height: 1.5;
      direction: ltr;
      text-align: left;
    }

    .code-textarea:focus {
      outline: none;
      border-color: rgba(56, 189, 248, .5);
      box-shadow: 0 0 12px rgba(56, 189, 248, .1);
    }

    .output-box {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .console {
      width: 100%;
      padding: 12px;
      background: #0f1419;
      border: 1px solid rgba(56, 189, 248, .2);
      border-radius: 8px;
      color: #e8f05a;
      font-family: 'Monaco', 'Consolas', monospace;
      font-size: 13px;
      min-height: 120px;
      max-height: 250px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-wrap: break-word;
      line-height: 1.5;
      direction: ltr;
      text-align: left;
    }

    .console.empty {
      color: var(--muted);
    }

    .console::-webkit-scrollbar {
      width: 6px;
    }

    .console::-webkit-scrollbar-thumb {
      background: rgba(56, 189, 248, .3);
      border-radius: 3px;
    }

    .console.error {
      color: #f87171;
    }

    .console.success {
      color: #e8f05a;
    }

    .ide-buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .run-btn {
      padding: 8px 16px;
      background: linear-gradient(135deg, var(--accent-2), #16a34a);
      border: none;
      border-radius: 8px;
      color: #fff;
      cursor: pointer;
      font-weight: 600;
      font-size: .9rem;
      transition: all .25s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .run-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 16px rgba(34, 197, 94, .3);
    }

    .run-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .clear-btn {
      padding: 8px 16px;
      background: rgba(255, 255, 255, .08);
      border: 1px solid rgba(255, 255, 255, .15);
      border-radius: 8px;
      color: var(--text);
      cursor: pointer;
      font-weight: 500;
      font-size: .9rem;
      transition: all .25s ease;
    }

    .clear-btn:hover {
      background: rgba(255, 255, 255, .12);
    }

    .spinner {
      display: inline-block;
      width: 10px;
      height: 10px;
      border: 2px solid rgba(255, 255, 255, .3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>

    <div class="top-bar">
      <div class="brand">
        <div class="brand-icon">🐍</div>
        <div class="brand-text">
          <h2 data-i18n="brand_title">Python</h2>

    <div class="progress-bar">

    <!-- Questions -->
    <div id="examContent"></div>

    <!-- Footer -->
    <div id="examFooter"></div>
  </div>

  <!-- Result Modal -->
  <div class="result-modal" id="resultModal">
    <div id="resultContent"></div>
  </div>

        output: "📤 Output",
        waiting_run: "Waiting to run...",
        run: "Run",
        clear: "Clear",
        prev: "← Previous",
        next: "Next →",
        answered_of: (a, t) => `${a}/${t} questions answered`,
        finish_exam: "Finish Exam ✓",
        please_write_code: "⚠️ Please write some code",
        preparing: "⏳ Preparing...",
        pyodide_not_ready: "❌ Pyodide did not load. Please reload the page",
        running: "⏳ Running...",
        run_success: "✅ Code ran successfully",
        run_error: "❌ Error:",
        confirm_leave: "Are you sure? Your data will not be saved",
        error_loading_page: "Error loading page",
        error_saving_result: "Error saving result",
        result_excellent: "🎉 Excellent! Amazing result!",
        result_good: "✅ Good! You got a nice score",
        result_average: "📚 You got an average score",
        result_weak: "💪 Try again in a few days",
        out_of_100: "out of 100",
        correct_answers: "Correct Answers",
        wrong_answers: "Wrong Answers",
        time_label: "Time",
        back_action: "Back",
        retake: "Retake"
      }
    };

    let currentLang = 'fa';

    const LEVEL_NAME_KEYS = {
      beginner: 'level_beginner',
      intermediate: 'level_intermediate',
      advanced: 'level_advanced'
    };

    function setLang(lang) {
      currentLang = lang;
      document.documentElement.lang = lang;
      document.documentElement.dir = lang === 'fa' ? 'rtl' : 'ltr';

      // Update buttons
      document.getElementById('btn-fa').classList.toggle('active', lang === 'fa');
      document.getElementById('btn-en').classList.toggle('active', lang === 'en');

      // Update all [data-i18n] elements
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (i18n[lang][key]) {
          el.textContent = i18n[lang][key];
        }
      });

      // Save preference
      localStorage.setItem('lpic_lang', lang);

      // Rebuild exam questions in the new language (keeping the same shuffled order/answers)
      if (window.examSystem && examSystem.exam.questionOrder) {
        examSystem.exam.questions = examSystem.exam.questionOrder.map(
          i => window.PYTHON_QUESTIONS[currentLang][examSystem.exam.level][i]
        );
        examSystem.render();
      }
    }

    

    // ============ سیستم امتحان ============
    class ExamSystem {
      constructor() {
        this.SUPABASE = null;
        this.currentUser = null;
        this.pyodideReady = false;
        
        this.exam = {
          course: 'Python',
          level: 'beginner',
          questions: [],
          answers: {},
          startTime: null,
          timeRemaining: 0,
          timerInterval: null,
          submitted: false
        };

        this.levelTimes = {
          beginner: 15 * 60,
          intermediate: 20 * 60,
          advanced: 25 * 60
        };
      }

      async initPyodide() {
        try {
          if (this.pyodideReady && window.pyodide) {
            return;
          }
          
          console.log('🔄 Loading Pyodide...');
          
          // صبر کنیم تا loadPyodide موجود شود
          let attempts = 0;
          while (typeof loadPyodide === 'undefined' && attempts < 50) {
            await new Promise(r => setTimeout(r, 100));
            attempts++;
          }

          if (typeof loadPyodide === 'undefined') {
            throw new Error('loadPyodide failed to load');
          }

          window.pyodide = await loadPyodide({
            indexURL: 'https://cdn.jsdelivr.net/pyodide/v0.24.1/full/'
          });
          
          this.pyodideReady = true;
          console.log('✅ Pyodide ready');
        } catch (err) {
          console.error('❌ Pyodide error:', err);
          this.pyodideReady = false;
        }
      }

      async init() {
        try {
          // Initialize Pyodide اول
          await this.initPyodide();

          // Use shared Supabase client
          this.SUPABASE = SUPABASE;

          // Check auth
          const { data: { session } } = await this.SUPABASE.auth.getSession();
          if (!session) {
            this.goHome();
            return;
          }
          this.currentUser = session.user;

          // Parse URL
          const params = new URLSearchParams(window.location.search);
          this.exam.level = params.get('level') || 'beginner';
          this.exam.course = params.get('course') || 'Python';
          
          // Set time
          this.exam.timeRemaining = this.levelTimes[this.exam.level] || 15 * 60;
          this.exam.startTime = Date.now();

          // Load questions
          this.loadQuestions();
          this.loadFromStorage();
          this.render();
          this.startTimer();

          // Auto-save
          setInterval(() => this.saveToStorage(), 10000);

          // Prevent leaving without saving
          window.addEventListener('beforeunload', (e) => {
            if (!this.exam.submitted && Object.keys(this.exam.answers).length > 0) {
              e.preventDefault();
              e.returnValue = '';
            }
          });
        } catch (err) {
          console.error('خطا:', err);
          alert(i18n[currentLang].error_loading_page);
          this.goHome();
        }
      }

      loadQuestions() {
        const total = (window.PYTHON_QUESTIONS && window.PYTHON_QUESTIONS[currentLang] && window.PYTHON_QUESTIONS[currentLang][this.exam.level] || []).length;
        const order = Array.from({ length: total }, (_, i) => i);
        order.sort(() => Math.random() - 0.5);
        this.exam.questionOrder = order;
        this.exam.questions = order.map(i => window.PYTHON_QUESTIONS[currentLang][this.exam.level][i]);
      }

      render() {
        this.renderHeader();
        this.renderQuestions();
        this.renderFooter();
      }

      renderHeader() {
        const answered = Object.keys(this.exam.answers).length;
        const total = this.exam.questions.length;
        const levelName = i18n[currentLang][LEVEL_NAME_KEYS[this.exam.level]];

        document.querySelector('.course-level').textContent = `${this.exam.course} - ${levelName}`;
        document.getElementById('questionNumber').textContent = i18n[currentLang].question_of(answered, total);
      }

      formatQuestionText(text) {
        // اولین بخش قبل از خط خالی، سوال فارسی (راست‌چین) است
        // بخش بعدی (در صورت وجود) کد پایتون است و باید چپ‌چین نمایش داده شود
        const parts = text.split('\n\n');
        const question = parts[0];
        const code = parts.slice(1).join('\n\n');

        let html = `<span class="question-line">${question}</span>`;
        if (code) {
          html += `<code class="code-block">${code}</code>`;
        }
        return html;
      }

      renderQuestions() {
        const t = i18n[currentLang];
        const html = this.exam.questions.map((q, idx) => `
          <div class="question-item ${this.exam.answers[idx] !== undefined ? 'answered' : ''}">
            <div class="question-header">
              <h3>${t.question_label} ${idx + 1}</h3>
              <span class="question-status">${this.exam.answers[idx] !== undefined ? '✓' : '○'}</span>
            </div>
            <p class="question-text">${this.formatQuestionText(q.text)}</p>
            
            <!-- IDE Section -->
            <div class="question-ide">
              <div class="ide-label">${t.ide_title}</div>
              <div class="ide-grid">
                <div class="code-input">
                  <div class="input-label">${t.your_code}</div>
                  <textarea class="code-textarea" id="code-${idx}" dir="ltr" placeholder="${t.code_placeholder}"></textarea>
                </div>
                <div class="output-box">
                  <div class="input-label">${t.output}</div>
                  <div class="console empty" id="output-${idx}" dir="ltr">${t.waiting_run}</div>
                </div>
              </div>
              <div class="ide-buttons">
                <button class="run-btn" onclick="examSystem.runCode(${idx})">
                  <span>▶</span>
                  <span>${t.run}</span>
                  <span class="spinner" id="loader-${idx}" style="display:none;"></span>
                </button>
                <button class="clear-btn" onclick="examSystem.clearCode(${idx})">🗑️ ${t.clear}</button>
              </div>
            </div>
            
            <div class="options">
              ${q.options.map((opt, optIdx) => `
                <button class="option ${this.exam.answers[idx] === optIdx ? 'selected' : ''}"
                        onclick="examSystem.selectAnswer(${idx}, ${optIdx})">
                  <span class="option-radio"></span>
                  <span>${opt}</span>
                </button>
              `).join('')}
            </div>
          </div>
        `).join('');

        document.getElementById('examContent').innerHTML = html;
        this.updateProgress();
      }

      renderFooter() {
        const t = i18n[currentLang];
        const answered = Object.keys(this.exam.answers).length;
        const total = this.exam.questions.length;
        
        const html = `
          <div class="exam-nav">
            <button class="nav-btn" onclick="examSystem.previousQuestion()">${t.prev}</button>
            <span class="exam-info">${t.answered_of(answered, total)}</span>
            <button class="nav-btn" onclick="examSystem.nextQuestion()">${t.next}</button>
          </div>
          <button class="submit-btn" onclick="examSystem.submitExam()">${t.finish_exam}</button>
        `;

        document.getElementById('examFooter').innerHTML = html;
      }

      async runCode(idx) {
        const t = i18n[currentLang];
        const codeEl = document.getElementById(`code-${idx}`);
        const outputEl = document.getElementById(`output-${idx}`);
        const loaderEl = document.getElementById(`loader-${idx}`);
        const btnEl = event.target.closest('.run-btn');

        const code = codeEl.value.trim();
        if (!code) {
          outputEl.textContent = t.please_write_code;
          outputEl.className = 'console empty';
          return;
        }

        btnEl.disabled = true;
        loaderEl.style.display = 'inline-block';
        outputEl.textContent = t.preparing;
        outputEl.className = 'console';

        // صبر کنیم تا Pyodide آماده شود
        let attempts = 0;
        while (!this.pyodideReady && attempts < 30) {
          await new Promise(r => setTimeout(r, 100));
          attempts++;
        }

        if (!this.pyodideReady) {
          outputEl.textContent = t.pyodide_not_ready;
          outputEl.className = 'console error';
          btnEl.disabled = false;
          loaderEl.style.display = 'none';
          return;
        }

        try {
          outputEl.textContent = t.running;
          
          const lines = [];
          
          // Capture print output
          const printFunc = window.pyodide.globals.get('print');
          window.pyodide.globals.set('print', (...args) => {
            lines.push(args.join(' '));
          });

          // Run code
          const result = await window.pyodide.runPythonAsync(code);
          
          // Restore print
          window.pyodide.globals.set('print', printFunc);

          // Show output
          if (lines.length > 0) {
            outputEl.textContent = lines.join('\n');
            outputEl.className = 'console success';
          } else if (result !== null && result !== undefined) {
            outputEl.textContent = String(result);
            outputEl.className = 'console success';
          } else {
            outputEl.textContent = t.run_success;
            outputEl.className = 'console success';
          }
        } catch (err) {
          outputEl.textContent = `${t.run_error}\n${err.message}`;
          outputEl.className = 'console error';
        } finally {
          btnEl.disabled = false;
          loaderEl.style.display = 'none';
        }
      }

      clearCode(idx) {
        document.getElementById(`code-${idx}`).value = '';
        const outputEl = document.getElementById(`output-${idx}`);
        outputEl.textContent = i18n[currentLang].waiting_run;
        outputEl.className = 'console empty';
      }

      selectAnswer(questionIdx, optionIdx) {
        this.exam.answers[questionIdx] = optionIdx;
        this.render();
        this.saveToStorage();
      }

      updateProgress() {
        const answered = Object.keys(this.exam.answers).length;
        const progress = (answered / this.exam.questions.length) * 100;
        document.getElementById('progressFill').style.width = progress + '%';
      }

      previousQuestion() {
        const items = document.querySelectorAll('.question-item');
        for (let i = 0; i < items.length; i++) {
          if (items[i].getBoundingClientRect().top > 0) {
            if (i > 0) {
              items[i - 1].scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
            return;
          }
        }
      }

      nextQuestion() {
        const items = document.querySelectorAll('.question-item');
        for (let i = 0; i < items.length; i++) {
          if (items[i].getBoundingClientRect().top > 0) {
            if (i < items.length - 1) {
              items[i + 1].scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
            return;
          }
        }
      }

      startTimer() {
        this.updateTimer();
        this.exam.timerInterval = setInterval(() => {
          this.exam.timeRemaining--;
          this.updateTimer();

          if (this.exam.timeRemaining <= 0) {
            clearInterval(this.exam.timerInterval);
            this.submitExam();
          }
        }, 1000);
      }

      updateTimer() {
        const minutes = Math.floor(this.exam.timeRemaining / 60);
        const seconds = this.exam.timeRemaining % 60;
        
        const timerEl = document.getElementById('timer');
        timerEl.textContent = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        
        if (this.exam.timeRemaining <= 300) {
          timerEl.classList.add('warning');
        }
      }

      async submitExam() {
        if (this.exam.submitted) return;
        this.exam.submitted = true;
        clearInterval(this.exam.timerInterval);

        // Calculate score
        let correctCount = 0;
        Object.entries(this.exam.answers).forEach(([qIdx, answer]) => {
          if (this.exam.questions[parseInt(qIdx)].correct === answer) {
            correctCount++;
          }
        });

        const score = Math.round((correctCount / this.exam.questions.length) * 100);
        const timeSpent = Math.floor((Date.now() - this.exam.startTime) / 1000);

        // Save to database
        await this.saveResult(score, correctCount, timeSpent);

        // Show result
        this.showResult(score, correctCount, timeSpent);
        
        // Clear storage
        this.clearStorage();
      }

      async saveResult(score, correctCount, timeSpent) {
        if (!this.SUPABASE || !this.currentUser) return;

        try {
          const { error } = await this.SUPABASE.from('exam_results').insert({
            user_id: this.currentUser.id,
            email: this.currentUser.email,
            course: this.exam.course,
            level: this.exam.level,
            score: score,
            correct_answers: correctCount,
            wrong_answers: this.exam.questions.length - correctCount,
            time_spent: timeSpent,
            created_at: new Date().toISOString()
          });

          if (error) {
            console.error('Supabase error:', error);
            alert(i18n[currentLang].error_saving_result);
            return;
          }

          console.log('✓ Result saved');
        } catch (err) {
          console.error('خطا:', err);
        }
      }

      showResult(score, correctCount, timeSpent) {
        const t = i18n[currentLang];
        const minutes = Math.floor(timeSpent / 60);
        const seconds = timeSpent % 60;

        let message = '';
        if (score >= 90) message = t.result_excellent;
        else if (score >= 75) message = t.result_good;
        else if (score >= 50) message = t.result_average;
        else message = t.result_weak;

        const resultHTML = `
          <div class="result-content">
            <div class="result-message">${message}</div>
            <div class="big-score">${score}</div>
            <div class="result-label">${t.out_of_100}</div>

            <div class="result-details">
              <div class="detail-item">
                <span class="detail-icon">✓</span>
                <div class="detail-label">${t.correct_answers}</div>
                <div class="detail-value">${correctCount}</div>
              </div>

              <div class="detail-item">
                <span class="detail-icon">✗</span>
                <div class="detail-label">${t.wrong_answers}</div>
                <div class="detail-value">${this.exam.questions.length - correctCount}</div>
              </div>

              <div class="detail-item">
                <span class="detail-icon">⏱</span>
                <div class="detail-label">${t.time_label}</div>
                <div class="detail-value">${minutes}:${String(seconds).padStart(2, '0')}</div>
              </div>
            </div>

            <div class="result-actions">
              <button class="action-btn primary" onclick="examSystem.goHome()">${t.back_action}</button>
              <button class="action-btn secondary" onclick="examSystem.retakeExam()">${t.retake}</button>
            </div>
          </div>
        `;

        document.getElementById('resultContent').innerHTML = resultHTML;
        document.getElementById('resultModal').classList.add('show');
      }

      goBack() {
        if (Object.keys(this.exam.answers).length > 0) {
          if (!confirm(i18n[currentLang].confirm_leave)) {
            return;
          }
        }
        this.goHome();
      }

      goHome() {
        window.location.href = './python02.html';
      }

      retakeExam() {
        window.location.href = `./exam.html?level=${this.exam.level}&course=${this.exam.course}`;
      }

      saveToStorage() {
        const key = `exam_${this.exam.course}_${this.exam.level}`;
        const data = {
          answers: this.exam.answers,
          timeRemaining: this.exam.timeRemaining,
          startTime: this.exam.startTime
        };
        localStorage.setItem(key, JSON.stringify(data));
      }

      loadFromStorage() {
        const key = `exam_${this.exam.course}_${this.exam.level}`;
        const stored = localStorage.getItem(key);
        
        if (stored) {
          try {
            const data = JSON.parse(stored);
            this.exam.answers = data.answers || {};
            
            const elapsed = Math.floor((Date.now() - data.startTime) / 1000);
            this.exam.timeRemaining = Math.max(0, data.timeRemaining - elapsed);
          } catch (err) {
            console.error('خطا:', err);
          }
        }
      }

      clearStorage() {
        const key = `exam_${this.exam.course}_${this.exam.level}`;
        localStorage.removeItem(key);
      }
    }

    // Initialize
    let examSystem;
    document.addEventListener('DOMContentLoaded', () => {
      examSystem = new ExamSystem();
      examSystem.init();
    });
  </script>
</body>
</html>
