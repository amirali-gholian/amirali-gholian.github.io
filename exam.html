    // ============ سیستم امتحان ============
    class ExamSystem {
      constructor() {
        this.SUPABASE = null;
        this.currentUser = null;
        this.pyodideReady = false;
        
        this.exam = {
          course: 'Python',
          level: 'beginner',
          questions: [],
          answers: {},
          startTime: null,
          timeRemaining: 0,
          timerInterval: null,
          submitted: false
        };

        this.levelTimes = {
          beginner: 15 * 60,
          intermediate: 20 * 60,
          advanced: 25 * 60
        };
      }

      async initPyodide() {
        try {
          if (this.pyodideReady && window.pyodide) {
            return;
          }
          
          console.log('🔄 Pyodide load شروع...');
          
          // صبر کنیم تا loadPyodide موجود شود
          let attempts = 0;
          while (typeof loadPyodide === 'undefined' && attempts < 50) {
            await new Promise(r => setTimeout(r, 100));
            attempts++;
          }

          if (typeof loadPyodide === 'undefined') {
            throw new Error('loadPyodide failed to load');
          }

          window.pyodide = await loadPyodide({
            indexURL: 'https://cdn.jsdelivr.net/pyodide/v0.24.1/full/'
          });
          
          this.pyodideReady = true;
          console.log('✅ Pyodide آماده است');
        } catch (err) {
          console.error('❌ Pyodide خطا:', err);
          this.pyodideReady = false;
        }
      }

      async init() {
        try {
          // Initialize Pyodide اول
          await this.initPyodide();

          // Use shared Supabase client
          this.SUPABASE = SUPABASE;

          // Check auth
          const { data: { session } } = await this.SUPABASE.auth.getSession();
          if (!session) {
            this.goHome();
            return;
          }
          this.currentUser = session.user;

          // Parse URL
          const params = new URLSearchParams(window.location.search);
          this.exam.level = params.get('level') || 'beginner';
          this.exam.course = params.get('course') || 'Python';
          
          // Set time
          this.exam.timeRemaining = this.levelTimes[this.exam.level] || 15 * 60;
          this.exam.startTime = Date.now();

          // Load questions
          this.loadQuestions();
          this.loadFromStorage();
          this.render();
          this.startTimer();

          // Auto-save
          setInterval(() => this.saveToStorage(), 10000);

          // Prevent leaving without saving
          window.addEventListener('beforeunload', (e) => {
            if (!this.exam.submitted && Object.keys(this.exam.answers).length > 0) {
              e.preventDefault();
              e.returnValue = '';
            }
          });
        } catch (err) {
          console.error('خطا:', err);
          alert('خطا در بارگیری صفحه');
          this.goHome();
        }
      }

      loadQuestions() {
        const questions = PYTHON_QUESTIONS[this.exam.level] || [];
        const shuffled = [...questions].sort(() => Math.random() - 0.5);
        this.exam.questions = shuffled.slice(0, 10);
      }

      render() {
        this.renderHeader();
        this.renderQuestions();
        this.renderFooter();
      }

      renderHeader() {
        const levelNames = {
          beginner: '🌱 مقدماتی',
          intermediate: '🎯 متوسط',
          advanced: '🚀 پیشرفته'
        };

        const answered = Object.keys(this.exam.answers).length;
        const total = this.exam.questions.length;
        
        document.querySelector('.course-level').textContent = `${this.exam.course} - ${levelNames[this.exam.level]}`;
        document.getElementById('questionNumber').textContent = `سوال ${answered} از ${total}`;
      }

      formatQuestionText(text) {
        // اولین بخش قبل از خط خالی، سوال فارسی (راست‌چین) است
        // بخش بعدی (در صورت وجود) کد پایتون است و باید چپ‌چین نمایش داده شود
        const parts = text.split('\n\n');
        const question = parts[0];
        const code = parts.slice(1).join('\n\n');

        let html = `<span class="question-line">${question}</span>`;
        if (code) {
          html += `<code class="code-block">${code}</code>`;
        }
        return html;
      }

      renderQuestions() {
        const html = this.exam.questions.map((q, idx) => `
          <div class="question-item ${this.exam.answers[idx] !== undefined ? 'answered' : ''}">
            <div class="question-header">
              <h3>سوال ${idx + 1}</h3>
              <span class="question-status">${this.exam.answers[idx] !== undefined ? '✓' : '○'}</span>
            </div>
            <p class="question-text">${this.formatQuestionText(q.text)}</p>
            
            <!-- IDE Section -->
            <div class="question-ide">
              <div class="ide-label">💻 تست کد</div>
              <div class="ide-grid">
                <div class="code-input">
                  <div class="input-label">📝 کد شما</div>
                  <textarea class="code-textarea" id="code-${idx}" dir="ltr" placeholder="کد Python خود را اینجا بنویسید..."></textarea>
                </div>
                <div class="output-box">
                  <div class="input-label">📤 خروجی</div>
                  <div class="console empty" id="output-${idx}" dir="ltr">منتظر اجرا...</div>
                </div>
              </div>
              <div class="ide-buttons">
                <button class="run-btn" onclick="examSystem.runCode(${idx})">
                  <span>▶</span>
                  <span>اجرا</span>
                  <span class="spinner" id="loader-${idx}" style="display:none;"></span>
                </button>
                <button class="clear-btn" onclick="examSystem.clearCode(${idx})">🗑️ پاک‌کردن</button>
              </div>
            </div>
            
            <div class="options">
              ${q.options.map((opt, optIdx) => `
                <button class="option ${this.exam.answers[idx] === optIdx ? 'selected' : ''}"
                        onclick="examSystem.selectAnswer(${idx}, ${optIdx})">
                  <span class="option-radio"></span>
                  <span>${opt}</span>
                </button>
              `).join('')}
            </div>
          </div>
        `).join('');

        document.getElementById('examContent').innerHTML = html;
        this.updateProgress();
      }

      renderFooter() {
        const answered = Object.keys(this.exam.answers).length;
        const total = this.exam.questions.length;
        
        const html = `
          <div class="exam-nav">
            <button class="nav-btn" onclick="examSystem.previousQuestion()">← قبلی</button>
            <span class="exam-info">${answered}/${total} سوال پاسخ داده شد</span>
            <button class="nav-btn" onclick="examSystem.nextQuestion()">بعدی →</button>
          </div>
          <button class="submit-btn" onclick="examSystem.submitExam()">پایان آزمون ✓</button>
        `;

        document.getElementById('examFooter').innerHTML = html;
      }

      async runCode(idx) {
        const codeEl = document.getElementById(`code-${idx}`);
        const outputEl = document.getElementById(`output-${idx}`);
        const loaderEl = document.getElementById(`loader-${idx}`);
        const btnEl = event.target.closest('.run-btn');

        const code = codeEl.value.trim();
        if (!code) {
          outputEl.textContent = '⚠️ لطفاً کدی بنویسید';
          outputEl.className = 'console empty';
          return;
        }

        btnEl.disabled = true;
        loaderEl.style.display = 'inline-block';
        outputEl.textContent = '⏳ در حال آماده‌سازی...';
        outputEl.className = 'console';

        // صبر کنیم تا Pyodide آماده شود
        let attempts = 0;
        while (!this.pyodideReady && attempts < 30) {
          await new Promise(r => setTimeout(r, 100));
          attempts++;
        }

        if (!this.pyodideReady) {
          outputEl.textContent = '❌ Pyodide آماده نشد. صفحه را دوباره بارگذاری کنید';
          outputEl.className = 'console error';
          btnEl.disabled = false;
          loaderEl.style.display = 'none';
          return;
        }

        try {
          outputEl.textContent = '⏳ در حال اجرا...';
          
          const lines = [];
          
          // Capture print output
          const printFunc = window.pyodide.globals.get('print');
          window.pyodide.globals.set('print', (...args) => {
            lines.push(args.join(' '));
          });

          // Run code
          const result = await window.pyodide.runPythonAsync(code);
          
          // Restore print
          window.pyodide.globals.set('print', printFunc);

          // Show output
          if (lines.length > 0) {
            outputEl.textContent = lines.join('\n');
            outputEl.className = 'console success';
          } else if (result !== null && result !== undefined) {
            outputEl.textContent = String(result);
            outputEl.className = 'console success';
          } else {
            outputEl.textContent = '✅ کد با موفقیت اجرا شد';
            outputEl.className = 'console success';
          }
        } catch (err) {
          outputEl.textContent = `❌ خطا:\n${err.message}`;
          outputEl.className = 'console error';
        } finally {
          btnEl.disabled = false;
          loaderEl.style.display = 'none';
        }
      }

      clearCode(idx) {
        document.getElementById(`code-${idx}`).value = '';
        const outputEl = document.getElementById(`output-${idx}`);
        outputEl.textContent = 'منتظر اجرا...';
        outputEl.className = 'console empty';
      }

      selectAnswer(questionIdx, optionIdx) {
        this.exam.answers[questionIdx] = optionIdx;
        this.render();
        this.saveToStorage();
      }

      updateProgress() {
        const answered = Object.keys(this.exam.answers).length;
        const progress = (answered / this.exam.questions.length) * 100;
        document.getElementById('progressFill').style.width = progress + '%';
      }

      previousQuestion() {
        const items = document.querySelectorAll('.question-item');
        for (let i = 0; i < items.length; i++) {
          if (items[i].getBoundingClientRect().top > 0) {
            if (i > 0) {
              items[i - 1].scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
            return;
          }
        }
      }

      nextQuestion() {
        const items = document.querySelectorAll('.question-item');
        for (let i = 0; i < items.length; i++) {
          if (items[i].getBoundingClientRect().top > 0) {
            if (i < items.length - 1) {
              items[i + 1].scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
            return;
          }
        }
      }

      startTimer() {
        this.updateTimer();
        this.exam.timerInterval = setInterval(() => {
          this.exam.timeRemaining--;
          this.updateTimer();

          if (this.exam.timeRemaining <= 0) {
            clearInterval(this.exam.timerInterval);
            this.submitExam();
          }
        }, 1000);
      }

      updateTimer() {
        const minutes = Math.floor(this.exam.timeRemaining / 60);
        const seconds = this.exam.timeRemaining % 60;
        
        const timerEl = document.getElementById('timer');
        timerEl.textContent = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        
        if (this.exam.timeRemaining <= 300) {
          timerEl.classList.add('warning');
        }
      }

      async submitExam() {
        if (this.exam.submitted) return;
        this.exam.submitted = true;
        clearInterval(this.exam.timerInterval);

        // Calculate score
        let correctCount = 0;
        Object.entries(this.exam.answers).forEach(([qIdx, answer]) => {
          if (this.exam.questions[parseInt(qIdx)].correct === answer) {
            correctCount++;
          }
        });

        const score = Math.round((correctCount / this.exam.questions.length) * 100);
        const timeSpent = Math.floor((Date.now() - this.exam.startTime) / 1000);

        // Save to database
        await this.saveResult(score, correctCount, timeSpent);

        // Show result
        this.showResult(score, correctCount, timeSpent);
        
        // Clear storage
        this.clearStorage();
      }

      async saveResult(score, correctCount, timeSpent) {
        if (!this.SUPABASE || !this.currentUser) return;

        try {
          const { error } = await this.SUPABASE.from('exam_results').insert({
            user_id: this.currentUser.id,
            email: this.currentUser.email,
            course: this.exam.course,
            level: this.exam.level,
            score: score,
            correct_answers: correctCount,
            wrong_answers: this.exam.questions.length - correctCount,
            time_spent: timeSpent,
            created_at: new Date().toISOString()
          });

          if (error) {
            console.error('خطا Supabase:', error);
            alert('خطا در ذخیره نتیجه');
            return;
          }

          console.log('✓ نتیجه ذخیره شد');
        } catch (err) {
          console.error('خطا:', err);
        }
      }

      showResult(score, correctCount, timeSpent) {
        const minutes = Math.floor(timeSpent / 60);
        const seconds = timeSpent % 60;

        let message = '';
        if (score >= 90) message = '🎉 عالی! نتیجه فوق‌العاده‌ای گرفتید!';
        else if (score >= 75) message = '✅ خوب! نتیجه خوبی گرفتید';
        else if (score >= 50) message = '📚 نتیجه متوسطی دریافت کردید';
        else message = '💪 چند روز دیگر دوباره تلاش کنید';

        const resultHTML = `
          <div class="result-content">
            <div class="result-message">${message}</div>
            <div class="big-score">${score}</div>
            <div class="result-label">از 100</div>

            <div class="result-details">
              <div class="detail-item">
                <span class="detail-icon">✓</span>
                <div class="detail-label">پاسخ صحیح</div>
                <div class="detail-value">${correctCount}</div>
              </div>

              <div class="detail-item">
                <span class="detail-icon">✗</span>
                <div class="detail-label">پاسخ غلط</div>
                <div class="detail-value">${this.exam.questions.length - correctCount}</div>
              </div>

              <div class="detail-item">
                <span class="detail-icon">⏱</span>
                <div class="detail-label">زمان</div>
                <div class="detail-value">${minutes}:${String(seconds).padStart(2, '0')}</div>
              </div>
            </div>

            <div class="result-actions">
              <button class="action-btn primary" onclick="examSystem.goHome()">بازگشت</button>
              <button class="action-btn secondary" onclick="examSystem.retakeExam()">دوباره</button>
            </div>
          </div>
        `;

        document.getElementById('resultContent').innerHTML = resultHTML;
        document.getElementById('resultModal').classList.add('show');
      }

      goBack() {
        if (Object.keys(this.exam.answers).length > 0) {
          if (!confirm('آیا مطمئن هستید؟ داده‌های شما ذخیره نخواهد شد')) {
            return;
          }
        }
        this.goHome();
      }

      goHome() {
        window.location.href = './python02.html';
      }

      retakeExam() {
        window.location.href = `./exam.html`;
      }

      saveToStorage() {
        const key = `exam_${this.exam.course}_${this.exam.level}`;
        const data = {
          answers: this.exam.answers,
          timeRemaining: this.exam.timeRemaining,
          startTime: this.exam.startTime
        };
        localStorage.setItem(key, JSON.stringify(data));
      }

      loadFromStorage() {
        const key = `exam_${this.exam.course}_${this.exam.level}`;
        const stored = localStorage.getItem(key);
        
        if (stored) {
          try {
            const data = JSON.parse(stored);
            this.exam.answers = data.answers || {};
            
            const elapsed = Math.floor((Date.now() - data.startTime) / 1000);
            this.exam.timeRemaining = Math.max(0, data.timeRemaining - elapsed);
          } catch (err) {
            console.error('خطا:', err);
          }
        }
      }

      clearStorage() {
        const key = `exam_${this.exam.course}_${this.exam.level}`;
        localStorage.removeItem(key);
      }
    }

    // Initialize
    let examSystem;
    document.addEventListener('DOMContentLoaded', () => {
      examSystem = new ExamSystem();
      examSystem.init();
    });
  </script>

    // ============ سیستم امتحان ============
    class ExamSystem {
      constructor() {
        this.SUPABASE = null;
        this.currentUser = null;
        this.pyodideReady = false;
        
        this.exam = {
          course: 'Python',
          level: 'beginner',
          questions: [],
          answers: {},
          startTime: null,
          timeRemaining: 0,
          timerInterval: null,
          submitted: false
        };

        this.levelTimes = {
          beginner: 15 * 60,
          intermediate: 20 * 60,
          advanced: 25 * 60
        };
      }

      async initPyodide() {
        try {
          if (this.pyodideReady && window.pyodide) {
            return;
          }
          
          console.log('🔄 Pyodide load شروع...');
          
          // صبر کنیم تا loadPyodide موجود شود
          let attempts = 0;
          while (typeof loadPyodide === 'undefined' && attempts < 50) {
            await new Promise(r => setTimeout(r, 100));
            attempts++;
          }

          if (typeof loadPyodide === 'undefined') {
            throw new Error('loadPyodide failed to load');
          }

          window.pyodide = await loadPyodide({
            indexURL: 'https://cdn.jsdelivr.net/pyodide/v0.24.1/full/'
          });
          
          this.pyodideReady = true;
          console.log('✅ Pyodide آماده است');
        } catch (err) {
          console.error('❌ Pyodide خطا:', err);
          this.pyodideReady = false;
        }
      }

      async init() {
        try {
          // Initialize Pyodide اول
          await this.initPyodide();

          // Use shared Supabase client
          this.SUPABASE = SUPABASE;

          // Check auth
          const { data: { session } } = await this.SUPABASE.auth.getSession();
          if (!session) {
            this.goHome();
            return;
          }
          this.currentUser = session.user;

          // Parse URL
          const params = new URLSearchParams(window.location.search);
          this.exam.level = params.get('level') || 'beginner';
          this.exam.course = params.get('course') || 'Python';
          
          // Set time
          this.exam.timeRemaining = this.levelTimes[this.exam.level] || 15 * 60;
          this.exam.startTime = Date.now();

          // Load questions
          this.loadQuestions();
          this.loadFromStorage();
          this.render();
          this.startTimer();

          // Auto-save
          setInterval(() => this.saveToStorage(), 10000);

          // Prevent leaving without saving
          window.addEventListener('beforeunload', (e) => {
            if (!this.exam.submitted && Object.keys(this.exam.answers).length > 0) {
              e.preventDefault();
              e.returnValue = '';
            }
          });
        } catch (err) {
          console.error('خطا:', err);
          alert('خطا در بارگیری صفحه');
          this.goHome();
        }
      }

      loadQuestions() {
        const questions = PYTHON_QUESTIONS[this.exam.level] || [];
        const shuffled = [...questions].sort(() => Math.random() - 0.5);
        this.exam.questions = shuffled.slice(0, 10);
      }

      render() {
        this.renderHeader();
        this.renderQuestions();
        this.renderFooter();
      }

      renderHeader() {
        const levelNames = {
          beginner: '🌱 مقدماتی',
          intermediate: '🎯 متوسط',
          advanced: '🚀 پیشرفته'
        };

        const answered = Object.keys(this.exam.answers).length;
        const total = this.exam.questions.length;
        
        document.querySelector('.course-level').textContent = `${this.exam.course} - ${levelNames[this.exam.level]}`;
        document.getElementById('questionNumber').textContent = `سوال ${answered} از ${total}`;
      }

      formatQuestionText(text) {
        // اولین بخش قبل از خط خالی، سوال فارسی (راست‌چین) است
        // بخش بعدی (در صورت وجود) کد پایتون است و باید چپ‌چین نمایش داده شود
        const parts = text.split('\n\n');
        const question = parts[0];
        const code = parts.slice(1).join('\n\n');

        let html = `<span class="question-line">${question}</span>`;
        if (code) {
          html += `<code class="code-block">${code}</code>`;
        }
        return html;
      }

      renderQuestions() {
        const html = this.exam.questions.map((q, idx) => `
          <div class="question-item ${this.exam.answers[idx] !== undefined ? 'answered' : ''}">
            <div class="question-header">
              <h3>سوال ${idx + 1}</h3>
              <span class="question-status">${this.exam.answers[idx] !== undefined ? '✓' : '○'}</span>
            </div>
            <p class="question-text">${this.formatQuestionText(q.text)}</p>
            
            <!-- IDE Section -->
            <div class="question-ide">
              <div class="ide-label">💻 تست کد</div>
              <div class="ide-grid">
                <div class="code-input">
                  <div class="input-label">📝 کد شما</div>
                  <textarea class="code-textarea" id="code-${idx}" dir="ltr" placeholder="کد Python خود را اینجا بنویسید..."></textarea>
                </div>
                <div class="output-box">
                  <div class="input-label">📤 خروجی</div>
                  <div class="console empty" id="output-${idx}" dir="ltr">منتظر اجرا...</div>
                </div>
              </div>
              <div class="ide-buttons">
                <button class="run-btn" onclick="examSystem.runCode(${idx})">
                  <span>▶</span>
                  <span>اجرا</span>
                  <span class="spinner" id="loader-${idx}" style="display:none;"></span>
                </button>
                <button class="clear-btn" onclick="examSystem.clearCode(${idx})">🗑️ پاک‌کردن</button>
              </div>
            </div>
            
            <div class="options">
              ${q.options.map((opt, optIdx) => `
                <button class="option ${this.exam.answers[idx] === optIdx ? 'selected' : ''}"
                        onclick="examSystem.selectAnswer(${idx}, ${optIdx})">
                  <span class="option-radio"></span>
                  <span>${opt}</span>
                </button>
              `).join('')}
            </div>
          </div>
        `).join('');

        document.getElementById('examContent').innerHTML = html;
        this.updateProgress();
      }

      renderFooter() {
        const answered = Object.keys(this.exam.answers).length;
        const total = this.exam.questions.length;
        
        const html = `
          <div class="exam-nav">
            <button class="nav-btn" onclick="examSystem.previousQuestion()">← قبلی</button>
            <span class="exam-info">${answered}/${total} سوال پاسخ داده شد</span>
            <button class="nav-btn" onclick="examSystem.nextQuestion()">بعدی →</button>
          </div>
          <button class="submit-btn" onclick="examSystem.submitExam()">پایان آزمون ✓</button>
        `;

        document.getElementById('examFooter').innerHTML = html;
      }

      async runCode(idx) {
        const codeEl = document.getElementById(`code-${idx}`);
        const outputEl = document.getElementById(`output-${idx}`);
        const loaderEl = document.getElementById(`loader-${idx}`);
        const btnEl = event.target.closest('.run-btn');

        const code = codeEl.value.trim();
        if (!code) {
          outputEl.textContent = '⚠️ لطفاً کدی بنویسید';
          outputEl.className = 'console empty';
          return;
        }

        btnEl.disabled = true;
        loaderEl.style.display = 'inline-block';
        outputEl.textContent = '⏳ در حال آماده‌سازی...';
        outputEl.className = 'console';

        // صبر کنیم تا Pyodide آماده شود
        let attempts = 0;
        while (!this.pyodideReady && attempts < 30) {
          await new Promise(r => setTimeout(r, 100));
          attempts++;
        }

        if (!this.pyodideReady) {
          outputEl.textContent = '❌ Pyodide آماده نشد. صفحه را دوباره بارگذاری کنید';
          outputEl.className = 'console error';
          btnEl.disabled = false;
          loaderEl.style.display = 'none';
          return;
        }

        try {
          outputEl.textContent = '⏳ در حال اجرا...';
          
          const lines = [];
          
          // Capture print output
          const printFunc = window.pyodide.globals.get('print');
          window.pyodide.globals.set('print', (...args) => {
            lines.push(args.join(' '));
          });

          // Run code
          const result = await window.pyodide.runPythonAsync(code);
          
          // Restore print
          window.pyodide.globals.set('print', printFunc);

          // Show output
          if (lines.length > 0) {
            outputEl.textContent = lines.join('\n');
            outputEl.className = 'console success';
          } else if (result !== null && result !== undefined) {
            outputEl.textContent = String(result);
            outputEl.className = 'console success';
          } else {
            outputEl.textContent = '✅ کد با موفقیت اجرا شد';
            outputEl.className = 'console success';
          }
        } catch (err) {
          outputEl.textContent = `❌ خطا:\n${err.message}`;
          outputEl.className = 'console error';
        } finally {
          btnEl.disabled = false;
          loaderEl.style.display = 'none';
        }
      }

      clearCode(idx) {
        document.getElementById(`code-${idx}`).value = '';
        const outputEl = document.getElementById(`output-${idx}`);
        outputEl.textContent = 'منتظر اجرا...';
        outputEl.className = 'console empty';
      }

      selectAnswer(questionIdx, optionIdx) {
        this.exam.answers[questionIdx] = optionIdx;
        this.render();
        this.saveToStorage();
      }

      updateProgress() {
        const answered = Object.keys(this.exam.answers).length;
        const progress = (answered / this.exam.questions.length) * 100;
        document.getElementById('progressFill').style.width = progress + '%';
      }

      previousQuestion() {
        const items = document.querySelectorAll('.question-item');
        for (let i = 0; i < items.length; i++) {
          if (items[i].getBoundingClientRect().top > 0) {
            if (i > 0) {
              items[i - 1].scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
            return;
          }
        }
      }

      nextQuestion() {
        const items = document.querySelectorAll('.question-item');
        for (let i = 0; i < items.length; i++) {
          if (items[i].getBoundingClientRect().top > 0) {
            if (i < items.length - 1) {
              items[i + 1].scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
            return;
          }
        }
      }

      startTimer() {
        this.updateTimer();
        this.exam.timerInterval = setInterval(() => {
          this.exam.timeRemaining--;
          this.updateTimer();

          if (this.exam.timeRemaining <= 0) {
            clearInterval(this.exam.timerInterval);
            this.submitExam();
          }
        }, 1000);
      }

      updateTimer() {
        const minutes = Math.floor(this.exam.timeRemaining / 60);
        const seconds = this.exam.timeRemaining % 60;
        
        const timerEl = document.getElementById('timer');
        timerEl.textContent = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        
        if (this.exam.timeRemaining <= 300) {
          timerEl.classList.add('warning');
        }
      }

      async submitExam() {
        if (this.exam.submitted) return;
        this.exam.submitted = true;
        clearInterval(this.exam.timerInterval);

        // Calculate score
        let correctCount = 0;
        Object.entries(this.exam.answers).forEach(([qIdx, answer]) => {
          if (this.exam.questions[parseInt(qIdx)].correct === answer) {
            correctCount++;
          }
        });

        const score = Math.round((correctCount / this.exam.questions.length) * 100);
        const timeSpent = Math.floor((Date.now() - this.exam.startTime) / 1000);

        // Save to database
        await this.saveResult(score, correctCount, timeSpent);

        // Show result
        this.showResult(score, correctCount, timeSpent);
        
        // Clear storage
        this.clearStorage();
      }

      async saveResult(score, correctCount, timeSpent) {
        if (!this.SUPABASE || !this.currentUser) return;

        try {
          const { error } = await this.SUPABASE.from('exam_results').insert({
            user_id: this.currentUser.id,
            email: this.currentUser.email,
            course: this.exam.course,
            level: this.exam.level,
            score: score,
            correct_answers: correctCount,
            wrong_answers: this.exam.questions.length - correctCount,
            time_spent: timeSpent,
            created_at: new Date().toISOString()
          });

          if (error) {
            console.error('خطا Supabase:', error);
            alert('خطا در ذخیره نتیجه');
            return;
          }

          console.log('✓ نتیجه ذخیره شد');
        } catch (err) {
          console.error('خطا:', err);
        }
      }

      showResult(score, correctCount, timeSpent) {
        const minutes = Math.floor(timeSpent / 60);
        const seconds = timeSpent % 60;

        let message = '';
        if (score >= 90) message = '🎉 عالی! نتیجه فوق‌العاده‌ای گرفتید!';
        else if (score >= 75) message = '✅ خوب! نتیجه خوبی گرفتید';
        else if (score >= 50) message = '📚 نتیجه متوسطی دریافت کردید';
        else message = '💪 چند روز دیگر دوباره تلاش کنید';

        const resultHTML = `
          <div class="result-content">
            <div class="result-message">${message}</div>
            <div class="big-score">${score}</div>
            <div class="result-label">از 100</div>

            <div class="result-details">
              <div class="detail-item">
                <span class="detail-icon">✓</span>
                <div class="detail-label">پاسخ صحیح</div>
                <div class="detail-value">${correctCount}</div>
              </div>

              <div class="detail-item">
                <span class="detail-icon">✗</span>
                <div class="detail-label">پاسخ غلط</div>
                <div class="detail-value">${this.exam.questions.length - correctCount}</div>
              </div>

              <div class="detail-item">
                <span class="detail-icon">⏱</span>
                <div class="detail-label">زمان</div>
                <div class="detail-value">${minutes}:${String(seconds).padStart(2, '0')}</div>
              </div>
            </div>

            <div class="result-actions">
              <button class="action-btn primary" onclick="examSystem.goHome()">بازگشت</button>
              <button class="action-btn secondary" onclick="examSystem.retakeExam()">دوباره</button>
            </div>
          </div>
        `;

        document.getElementById('resultContent').innerHTML = resultHTML;
        document.getElementById('resultModal').classList.add('show');
      }

      goBack() {
        if (Object.keys(this.exam.answers).length > 0) {
          if (!confirm('آیا مطمئن هستید؟ داده‌های شما ذخیره نخواهد شد')) {
            return;
          }
        }
        this.goHome();
      }

      goHome() {
        window.location.href = './python02.html';
      }

      retakeExam() {
        window.location.href = `./exam.html`;
      }

      saveToStorage() {
        const key = `exam_${this.exam.course}_${this.exam.level}`;
        const data = {
          answers: this.exam.answers,
          timeRemaining: this.exam.timeRemaining,
          startTime: this.exam.startTime
        };
        localStorage.setItem(key, JSON.stringify(data));
      }

      loadFromStorage() {
        const key = `exam_${this.exam.course}_${this.exam.level}`;
        const stored = localStorage.getItem(key);
        
        if (stored) {
          try {
            const data = JSON.parse(stored);
            this.exam.answers = data.answers || {};
            
            const elapsed = Math.floor((Date.now() - data.startTime) / 1000);
            this.exam.timeRemaining = Math.max(0, data.timeRemaining - elapsed);
          } catch (err) {
            console.error('خطا:', err);
          }
        }
      }

      clearStorage() {
        const key = `exam_${this.exam.course}_${this.exam.level}`;
        localStorage.removeItem(key);
      }
    }

    // Initialize
    let examSystem;
    document.addEventListener('DOMContentLoaded', () => {
      examSystem = new ExamSystem();
      examSystem.init();
    });
  </script>
