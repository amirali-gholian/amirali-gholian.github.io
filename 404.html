<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>404 | Not Found</title>

<style>

:root {
    --bg-0:#0a0f1c;
    --accent-a:#2dd4bf;
    --accent-b:#8b5cf6;
    --text:#e5e7eb;
    --muted:#7d8aa3;
}

*{
    box-sizing:border-box;
}

html,body{
    height:100%;
    margin:0;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:24px;
    font-family:-apple-system,"Segoe UI","Vazirmatn",Tahoma,sans-serif;
    color:var(--text);

    background:
    radial-gradient(circle at 50% 15%,rgba(45,212,191,.12),transparent 55%),
    radial-gradient(circle at 80% 85%,rgba(139,92,246,.12),transparent 55%),
    var(--bg-0);

    overflow:hidden;
}


.card{
    text-align:center;
    max-width:420px;
    width:100%;
}


.error{

    font-size:110px;
    font-weight:800;
    letter-spacing:8px;

    background:linear-gradient(
        135deg,
        var(--accent-a),
        var(--accent-b)
    );

    -webkit-background-clip:text;
    color:transparent;

    animation:float 3s infinite ease-in-out;
}


@keyframes float{

50%{
transform:translateY(-8px);
}

}


.signal{

position:relative;
width:50px;
height:50px;
margin:20px auto;

}


.signal span{

position:absolute;
left:50%;
top:50%;

width:12px;
height:12px;

border-radius:50%;
transform:translate(-50%,-50%);

border:2px solid var(--accent-a);

animation:ping 2.5s infinite;

}


.signal span:nth-child(2){
animation-delay:.8s;
}


.signal span:nth-child(3){
animation-delay:1.6s;
}


.center{

background:linear-gradient(
135deg,
var(--accent-a),
var(--accent-b)
);

border:none!important;

}


@keyframes ping{

0%{
width:12px;
height:12px;
opacity:.8;
}

100%{

width:55px;
height:55px;
opacity:0;

}

}


h1{

font-size:22px;
margin:10px 0;

}


p{

color:var(--muted);
font-size:14px;
line-height:1.8;
margin-bottom:25px;

}


.btn{

display:inline-block;

padding:12px 30px;

border-radius:999px;

text-decoration:none;

color:var(--text);

background:rgba(255,255,255,.05);

border:1px solid rgba(255,255,255,.12);

font-size:14px;

font-weight:600;

transition:.3s;

}


.btn:hover{

background:rgba(45,212,191,.1);

border-color:#2dd4bf;

transform:translateY(-3px);

}


.status{

margin-top:18px;

font-size:12px;

color:var(--muted);

}


</style>

</head>


<body>


<div class="card">


<div class="error">
404
</div>


<div class="signal">

<span></span>
<span></span>
<span></span>
<span class="center"></span>

</div>


<h1>
Connection Lost
</h1>


<p>
The page you are looking for doesn't exist.<br>
The requested destination could not be reached.
</p>


<a class="btn" href="index.html">
Back To Home
</a>


<div class="status">
Amirali Gholian • System Error
</div>


</div>


</body>
</html>
