<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline</title>
<style>
    :root {
        --bg-0: #0a0f1c;
        --bg-1: #111827;
        --accent-a: #2dd4bf;
        --accent-b: #8b5cf6;
        --text: #e5e7eb;
        --muted: #7d8aa3;
    }
    

    * { box-sizing: border-box; }

    html, body {
        height: 100%;
        margin: 0;
    }

    body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 24px;
        font-family: -apple-system, "Segoe UI", "Vazirmatn", Tahoma, sans-serif;
        color: var(--text);
        background:
            radial-gradient(circle at 50% 15%, rgba(45, 212, 191, 0.10), transparent 55%),
            radial-gradient(circle at 80% 85%, rgba(139, 92, 246, 0.10), transparent 55%),
            var(--bg-0);
        overflow: hidden;
    }

    .card {
        text-align: center;
        max-width: 380px;
        width: 100%;
    }

    /* --- Logo with breathing glow --- */
    .logo-wrap {
        position: relative;
        width: 128px;
        height: 128px;
        margin: 0 auto 8px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .glow-ring {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
        filter: blur(22px);
        opacity: 0.35;
        animation: breathe 3.2s ease-in-out infinite;
    }

    @keyframes breathe {
        0%, 100% { transform: scale(0.85); opacity: 0.25; }
        50%      { transform: scale(1.05); opacity: 0.45; }
    }

    .logo {
        position: relative;
        width: 84px;
        height: 84px;
        object-fit: contain;
        border-radius: 22px;
        animation: float 3.2s ease-in-out infinite;
    }

    /* fallback if the logo file can't load while offline */
    .logo::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 22px;
        background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
        z-index: -1;
    }

    @keyframes float {
        0%, 100% { transform: translateY(0); }
        50%      { transform: translateY(-6px); }
    }

    /* --- Radar / signal search animation --- */
    .signal {
        position: relative;
        width: 46px;
        height: 46px;
        margin: 22px auto 18px;
    }

    .signal-dot {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 10px;
        height: 10px;
        margin: -5px 0 0 -5px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
    }

    .signal-ring {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 10px;
        height: 10px;
        margin: -5px 0 0 -5px;
        border-radius: 50%;
        border: 1.5px solid var(--accent-a);
        opacity: 0;
        animation: ping 2.4s cubic-bezier(0.2, 0.6, 0.4, 1) infinite;
    }

    .signal-ring:nth-child(2) { animation-delay: 0.8s; }
    .signal-ring:nth-child(3) { animation-delay: 1.6s; }

    @keyframes ping {
        0%   { width: 10px; height: 10px; margin: -5px 0 0 -5px; opacity: 0.55; border-color: var(--accent-a); }
        100% { width: 46px; height: 46px; margin: -23px 0 0 -23px; opacity: 0; border-color: var(--accent-b); }
    }

    h1 {
        font-size: 21px;
        font-weight: 700;
        margin: 0 0 8px;
        letter-spacing: -0.01em;
    }

    p {
        font-size: 14px;
        line-height: 1.9;
        color: var(--muted);
        margin: 0 0 26px;
    }

    .retry-btn {
        appearance: none;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(255, 255, 255, 0.04);
        color: var(--text);
        font-family: inherit;
        font-size: 14px;
        font-weight: 600;
        padding: 11px 26px;
        border-radius: 999px;
        cursor: pointer;
        transition: border-color 0.2s ease, background 0.2s ease, transform 0.15s ease;
    }

    .retry-btn:hover {
        border-color: rgba(45, 212, 191, 0.5);
        background: rgba(45, 212, 191, 0.08);
    }

    .retry-btn:active {
        transform: scale(0.97);
    }

    .status {
        margin-top: 16px;
        font-size: 12px;
        color: var(--muted);
        min-height: 16px;
    }

    @media (prefers-reduced-motion: reduce) {
        .glow-ring, .logo, .signal-ring { animation: none; }
    }
</style>
</head>
<body>

    <div class="card">

        <div class="logo-wrap">
            <div class="glow-ring"></div>
            <img class="logo" src="/logo.webp" alt="Logo" onerror="this.style.display='none'">
        </div>

        <div class="signal">
            <span class="signal-ring"></span>
            <span class="signal-ring"></span>
            <span class="signal-ring"></span>
            <span class="signal-dot"></span>
        </div>

        <h1>You're offline</h1>
        <p>This page isn't available right now. We'll bring you back automatically once you're reconnected.</p>

        <button class="retry-btn" onclick="location.reload()">Try again</button>
        <div class="status" id="status"></div>

    </div>

    <script>
        // به محض برگشت اینترنت، خودکار صفحه رو رفرش کن
        window.addEventListener("online", () => {
            document.getElementById("status").textContent = "Back online, reloading...";
            setTimeout(() => location.reload(), 600);
        });

        // چک دوره‌ای برای مرورگرهایی که ایونت online رو درست نمی‌فرستن
        setInterval(() => {
            if (navigator.onLine) {
                location.reload();
            }
        }, 5000);
    </script>

</body>
</html>
